# The page origin. Static files only — no API, no cookies, nothing to steal.
# Pages run model-written scripts, so the app embeds them with
# sandbox="allow-scripts" and WITHOUT allow-same-origin, which drops them into
# an opaque origin. This server is the second half of that: a different origin
# from the app, and a CSP that cuts off the network.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy
    "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  # Revalidate rather than cache hard. Improving the shell and letting every
  # existing page pick the fix up on reload is a core property of this system —
  # it has already taken past pages from broken to correct with no regeneration.
  # The previous "expires 30d, immutable" defeated exactly that, and it was on
  # `location /lib/`, which never matched anyway: pages are served under /pages/,
  # so they request /pages/lib/..., which fell through to `location /`. Set it
  # here, at server level, where it covers both. An unchanged file still costs
  # only a 304.
  add_header Cache-Control "no-cache" always;
  add_header Referrer-Policy no-referrer always;
  # A sandboxed iframe without allow-same-origin has an OPAQUE origin — its
  # Origin header (and JS-visible origin) is the literal string "null", not
  # http://localhost:8080, even though it's requesting resources FROM
  # localhost:8080. That mismatch doesn't matter for scripts, stylesheets or
  # images — the browser only enforces cross-origin restrictions on those
  # per the CSP above — but web fonts are the one resource type the fetch
  # spec always loads in CORS mode regardless of how they're referenced
  # (plain @font-face, same physical origin or not). With no
  # Access-Control-Allow-Origin here, every page's fonts 404 in the console
  # and the browser silently falls back to its default font instead of
  # KaTeX's and Sarabun's — a page that check.mjs and a human both see
  # rendering with the wrong glyphs the moment it's actually opened inside
  # the app rather than navigated to directly. "*" is safe for the same
  # reason this whole origin already is (see the module comment: static
  # files, no auth, no cookies, nothing a cross-origin read could steal) —
  # CORS controls who may READ a response, not who may fetch a public file.
  add_header Access-Control-Allow-Origin "*" always;

  # 'unsafe-inline' is unavoidable: the page IS an inline script. That is why the
  # iframe sandbox, not this header, is the real boundary. connect-src 'none'
  # is the part that matters here — a page cannot phone home.

  types { application/javascript js; text/css css; font/woff2 woff2; text/html html; }

  location /lib/ { }
  location / { try_files $uri $uri/ =404; }
}
