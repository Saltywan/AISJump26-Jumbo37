<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>จุดตัดวงรีและเส้นตรง และพื้นที่สามเหลี่ยม</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/jsxgraph.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/jsxgraphcore.js"></script>
<script src="./lib/shell.js"></script>
<script>
Shell.page({
  title: 'จุดตัดวงรีและเส้นตรง และพื้นที่สามเหลี่ยม',
  problem: 'วงรี $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$ และเส้นตรง $3x + 5y = 15$ ตัดกันที่จุดสองจุด จุด $A$ และจุด $B$ โดย $A$ อยู่บนแกน $x$ จงหาพิกัดของจุด $A$ และจุด $B$ แล้วหาพื้นที่ของสามเหลี่ยมที่เกิดจากจุด $A$, จุด $B$ และจุดศูนย์กลางวงรี'
});

var b = Shell.board({box: [-8, 4.5, 8, -4.5], axis: true, grid: true, keepaspect: true});
var C = Shell.C;

Shell.setup('จุดตัดของกราฟทั้งสองหาได้จากการแก้ระบบสมการ เมื่อได้จุดยอดทั้งสามของสามเหลี่ยมที่อยู่บนแกนพิกัดฉาก จะสามารถหาพื้นที่ได้โดยตรงจากความยาวฐานและส่วนสูงที่ตั้งฉากกัน');

var O = b.create('point', [0, 0], {name: '', fixed: true, strokeColor: C.note, fillColor: C.note, size: 3});
var xAxis = b.create('line', [[0, 0], [1, 0]], {visible: false});
var yAxis = b.create('line', [[0, 0], [0, 1]], {visible: false});

var p1 = b.create('point', [-5, 6], {visible: false});
var p2 = b.create('point', [10, -3], {visible: false});
var line = b.create('line', [p1, p2], {name: '', strokeColor: C.given, strokeWidth: 2});

var el = b.create('curve', [
  function(t) { return 5 * Math.cos(t); },
  function(t) { return 3 * Math.sin(t); },
  0, 2 * Math.PI
], {name: '', strokeColor: C.given, strokeWidth: 2.5});

var A = b.create('intersection', [line, xAxis, 0], {name: '', strokeColor: C.answer, fillColor: C.answer, size: 4});
var B = b.create('intersection', [line, yAxis, 0], {name: '', strokeColor: C.answer, fillColor: C.answer, size: 4});

var tri = b.create('polygon', [O, A, B], {name: '', fillColor: C.answer, fillOpacity: 0.2, borders: {strokeColor: C.answer, strokeWidth: 2.5}});
var rightAngle = b.create('angle', [A, O, B], {name: '', radius: 0.5, strokeColor: C.work, fillColor: C.work, fillOpacity: 0.15});

Shell.group('วิเคราะห์กราฟและแก้ระบบสมการ');

var s1 = Shell.step('พิจารณาสมการวงรี $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$ ซึ่งมีจุดศูนย์กลางที่ $O(0, 0)$ และเส้นตรง $3x + 5y = 15$', {
  why: 'ต้องเขียนสมการให้อยู่ในรูปมาตรฐานเพื่อระบุจุดศูนย์กลางและจัดรูปสมการเส้นตรงสำหรับการแทนค่า'
});
Shell.on(s1, el, line, O);
Shell.tag(s1, O, '$O(0, 0)$', {role: 'note', until: 'end'});
Shell.tag(s1, [2.5, 2.3], '$3x + 5y = 15$', {role: 'given', until: 'step'});
Shell.tag(s1, [0, -3.5], '$\\frac{x^2}{25} + \\frac{y^2}{9} = 1$', {role: 'given', until: 'step'});

var s2 = Shell.step('จัดรูปสมการเส้นตรงเป็น $y = 3 - \\frac{3}{5}x$ แล้วแทนลงในสมการวงรี:<br>$\\frac{x^2}{25} + \\frac{(3 - \\frac{3}{5}x)^2}{9} = 1 \\implies \\frac{2x^2}{25} - \\frac{2x}{5} = 0 \\implies \\frac{2x}{5}\\left(\\frac{x}{5} - 1\\right) = 0$', {
  why: 'การแทนตัวแปร $y$ ด้วยนิพจน์ของ $x$ ช่วยลดรูปเป็นสมการกำลังสองตัวแปรเดียวเพื่อหาค่าพิกัด $x$ ของจุดตัด',
  uses: [1]
});

var s3 = Shell.step('แก้สมการกำลังสองได้ $x = 5$ หรือ $x = 0$<br>• เมื่อ $x = 5$ จะได้ $y = 3 - \\frac{3}{5}(5) = 0$ จุดนี้อยู่บนแกน $x$ จึงเป็นจุด $A(5, 0)$<br>• เมื่อ $x = 0$ จะได้ $y = 3 - \\frac{3}{5}(0) = 3$ คือจุด $B(0, 3)$', {
  why: 'โจทย์กำหนดว่าจุด $A$ อยู่บนแกน $x$ จึงต้องจับคู่ค่า $x = 5$ ที่ให้ค่า $y = 0$ เป็นจุด $A$',
  uses: [2]
});
Shell.on(s3, A, B);
Shell.tag(s3, A, '$A(5, 0)$', {role: 'answer', until: 'end'});
Shell.tag(s3, B, '$B(0, 3)$', {role: 'answer', until: 'end'});

Shell.group('สร้างรูปสามเหลี่ยมและหาพื้นที่');

var s4 = Shell.step('เชื่อมจุด $O(0, 0)$, $A(5, 0)$ และ $B(0, 3)$ เกิดเป็นสามเหลี่ยมมุมฉาก $OAB$<br>เนื่องจากแกน $x$ และแกน $y$ ตั้งฉากกันที่จุดกำเนิด ทำให้ด้าน $OA$ และ $OB$ ตั้งฉากกัน มีความยาว $OA = 5$ หน่วย และ $OB = 3$ หน่วย', {
  why: 'จุดยอดสองจุดอยู่บนแกนพิกัดฉากคนละแกน จึงใช้แกนพิกัดเป็นฐานและส่วนสูงที่ตั้งฉากกันโดยตรง',
  uses: [1, 3]
});
Shell.on(s4, tri, rightAngle);
Shell.tag(s4, [2.5, -0.5], '$OA = 5$', {role: 'work', until: 'step'});
Shell.tag(s4, [-1.0, 1.5], '$OB = 3$', {role: 'work', until: 'step'});

var s5 = Shell.step('คำนวณพื้นที่ของสามเหลี่ยม $OAB$ จากความยาวฐานและส่วนสูง:<br>พื้นที่ $\\triangle OAB = \\frac{1}{2} \\times OA \\times OB = \\frac{1}{2} \\times 5 \\times 3 = \\frac{15}{2} = 7.5$ ตารางหน่วย', {
  why: 'พื้นที่สามเหลี่ยมมุมฉากหาได้จากครึ่งหนึ่งของผลคูณระหว่างความยาวด้านประกอบมุมฉาก',
  uses: [4]
});
Shell.tag(s5, [1.7, 1.0], 'พื้นที่ $= 7.5$', {role: 'answer', until: 'end'});

Shell.answer(
  'พิกัดของจุด $A$, $B$ และพื้นที่ของสามเหลี่ยม $OAB$',
  '$A(5, 0),\\ B(0, 3)$ และพื้นที่ $= 7.5$ ตารางหน่วย',
  {sanity: 'พื้นที่ $7.5$ ตารางหน่วย เท่ากับครึ่งหนึ่งของพื้นที่สี่เหลี่ยมผืนผ้าขนาด $5 \\times 3 = 15$ ตารางหน่วย พอดี เนื่องจากเป็นสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากแนบไปตามแกนพิกัด'}
);

Shell.done();
</script>
</body></html>
