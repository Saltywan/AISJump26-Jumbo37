<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>การเลื่อนของบันไดและทฤษฎีบทพีทาโกรัส</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';
var PX_PER_M = 30;

Shell.page({
  title: 'การเลื่อนของบันไดและทฤษฎีบทพีทาโกรัส',
  problem: 'บันไดยาว $13$ เมตร พาดกับกำแพงโดยฐานบันไดห่างจากกำแพง $5$ เมตร ถ้าเลื่อนฐานบันไดออกไปอีก $2$ เมตร ปลายบันไดด้านบนจะเลื่อนลงมาจากเดิมกี่เมตร'
});

var canvas = Shell.canvas(), C = Shell.C;

Shell.setup('เนื่องจากกำแพงตั้งฉากกับพื้นดิน บันไดจึงประกอบกับกำแพงและพื้นเป็นรูปสามเหลี่ยมมุมฉาก โดยความยาวบันไดเป็นด้านตรงข้ามมุมฉากที่มีค่าคงที่ ($13$ m) เสมอ เราจึงใช้ทฤษฎีบทพีทาโกรัสคำนวณความสูงของปลายบันไดทั้งก่อนและหลังการเลื่อนได้');

// เส้นแบ่งโซนจำลองสถานการณ์ (ซ้าย) และโซนแบบจำลองคณิตศาสตร์ (ขวา)
var divider = document.createElementNS(SVGNS, 'line');
divider.setAttribute('x1', '495'); divider.setAttribute('y1', '45');
divider.setAttribute('x2', '495'); divider.setAttribute('y2', '510');
divider.setAttribute('stroke', C.note); divider.setAttribute('stroke-width', '1');
divider.setAttribute('stroke-dasharray', '4 6');
divider.setAttribute('opacity', '0.6');
canvas.appendChild(divider);

// วาดพื้นดิน
var groundLine = document.createElementNS(SVGNS, 'line');
groundLine.setAttribute('x1', '90'); groundLine.setAttribute('y1', '440');
groundLine.setAttribute('x2', '470'); groundLine.setAttribute('y2', '440');
groundLine.setAttribute('stroke', C.note); groundLine.setAttribute('stroke-width', '3');
canvas.appendChild(groundLine);

for (var gx = 100; gx < 460; gx += 22) {
  var gh = document.createElementNS(SVGNS, 'line');
  gh.setAttribute('x1', gx); gh.setAttribute('y1', '440');
  gh.setAttribute('x2', gx - 12); gh.setAttribute('y2', '454');
  gh.setAttribute('stroke', C.note); gh.setAttribute('stroke-width', '1.5');
  canvas.appendChild(gh);
}

// วาดกำแพง
var wallRect = document.createElementNS(SVGNS, 'rect');
wallRect.setAttribute('x', '130'); wallRect.setAttribute('y', '50');
wallRect.setAttribute('width', '70'); wallRect.setAttribute('height', '390');
wallRect.setAttribute('stroke', C.note); wallRect.setAttribute('stroke-width', '2');
wallRect.setAttribute('fill', 'none');
canvas.appendChild(wallRect);

for (var wy = 90; wy < 440; wy += 40) {
  var bl = document.createElementNS(SVGNS, 'line');
  bl.setAttribute('x1', '130'); bl.setAttribute('y1', wy);
  bl.setAttribute('x2', '200'); bl.setAttribute('y2', wy);
  bl.setAttribute('stroke', C.note); bl.setAttribute('stroke-width', '1');
  bl.setAttribute('stroke-dasharray', '2 4');
  canvas.appendChild(bl);
}

// สัญลักษณ์มุมฉากที่มุมกำแพง-พื้น
var raCorner = document.createElementNS(SVGNS, 'path');
raCorner.setAttribute('d', 'M 200 424 L 216 424 L 216 440');
raCorner.setAttribute('stroke', C.note); raCorner.setAttribute('stroke-width', '1.5');
raCorner.setAttribute('fill', 'none');
canvas.appendChild(raCorner);

Shell.label(canvas, 165, 34, 'กำแพง', {role: 'note', anchor: [165, 50], until: 'end'});
Shell.label(canvas, 435, 456, 'พื้นดิน', {role: 'note', anchor: [435, 440], until: 'end'});

// ฟังก์ชันช่วยวาดบันได
function drawLadder(parent, xB, yB, xT, yT, color, strokeW) {
  var grp = document.createElementNS(SVGNS, 'g');
  var dx = xT - xB, dy = yT - yB;
  var len = Math.hypot(dx, dy);
  var ux = dx / len, uy = dy / len;
  var nx = -uy, ny = ux;
  var w = 5;

  var r1 = document.createElementNS(SVGNS, 'line');
  r1.setAttribute('x1', xB - nx * w); r1.setAttribute('y1', yB - ny * w);
  r1.setAttribute('x2', xT - nx * w); r1.setAttribute('y2', yT - ny * w);
  r1.setAttribute('stroke', color); r1.setAttribute('stroke-width', strokeW || 3);
  r1.setAttribute('stroke-linecap', 'round');
  grp.appendChild(r1);

  var r2 = document.createElementNS(SVGNS, 'line');
  r2.setAttribute('x1', xB + nx * w); r2.setAttribute('y1', yB + ny * w);
  r2.setAttribute('x2', xT + nx * w); r2.setAttribute('y2', yT + ny * w);
  r2.setAttribute('stroke', color); r2.setAttribute('stroke-width', strokeW || 3);
  r2.setAttribute('stroke-linecap', 'round');
  grp.appendChild(r2);

  var numRungs = 9;
  for (var i = 1; i <= numRungs; i++) {
    var f = i / (numRungs + 1);
    var cx = xB + dx * f, cy = yB + dy * f;
    var rung = document.createElementNS(SVGNS, 'line');
    rung.setAttribute('x1', cx - nx * w); rung.setAttribute('y1', cy - ny * w);
    rung.setAttribute('x2', cx + nx * w); rung.setAttribute('y2', cy + ny * w);
    rung.setAttribute('stroke', color); rung.setAttribute('stroke-width', (strokeW || 3) * 0.7);
    grp.appendChild(rung);
  }
  parent.appendChild(grp);
  return grp;
}

// -------------------------------------------------------------------------
// ขั้นที่ 1: ความสูงเดิมของปลายบันได
// -------------------------------------------------------------------------
Shell.group('คำนวณความสูงเดิมของปลายบันได (สภาวะที่ 1)');

var s1 = Shell.step(
  'พิจารณาสภาวะเดิม: บันไดยาว $L = 13$ m ฐานบันไดห่างจากกำแพง $x_1 = 5$ m<br>หาความสูงเดิมของปลายบันได $y_1$ จากทฤษฎีบทพีทาโกรัส:<br>$5^2 + y_1^2 = 13^2 \\implies 25 + y_1^2 = 169 \\implies y_1 = \\sqrt{144} = 12$ m',
  {why: 'กำแพงตั้งฉากกับพื้นดิน ทำให้บันได กำแพง และพื้น ประกอบกันเป็นรูปสามเหลี่ยมมุมฉาก จึงหาความสูงเดิมได้จากทฤษฎีบทพีทาโกรัส'}
);

// บันไดเดิมในภาพจำลอง
drawLadder(s1, 350, 440, 200, 80, C.given, 3);
Shell.label(s1, 260, 245, 'บันไดเดิม ($13$ m)', {role: 'given', anchor: [275, 260], until: 'end'});

// ลูกศรบอกระยะฐานเดิม 5 m
Shell.arrow(s1, 200, 465, 350, 465, {role: 'given', label: '$5$ m', value: 5, unit: 'm', until: 'end'});

// ลูกศรบอกความสูงเดิม 12 m
Shell.arrow(s1, 175, 440, 175, 80, {role: 'work', label: '$y_1 = 12$ m', value: 12, unit: 'm', until: 'end'});

// รูปสามเหลี่ยมสภาวะที่ 1 ด้านขวา
var tri1 = document.createElementNS(SVGNS, 'g');
s1.appendChild(tri1);

Shell.label(s1, 620, 60, 'สภาวะที่ 1 (เดิม)', {role: 'given', anchor: [620, 60], until: 'end', pin: true});

var pathT1 = document.createElementNS(SVGNS, 'path');
pathT1.setAttribute('d', 'M 580 90 L 580 230 L 640 230 Z');
pathT1.setAttribute('stroke', C.given);
pathT1.setAttribute('stroke-width', '2.5');
pathT1.setAttribute('fill', 'none');
tri1.appendChild(pathT1);

var ra1 = document.createElementNS(SVGNS, 'path');
ra1.setAttribute('d', 'M 580 216 L 594 216 L 594 230');
ra1.setAttribute('stroke', C.note);
ra1.setAttribute('fill', 'none');
tri1.appendChild(ra1);

Shell.label(s1, 545, 160, '$y_1 = 12$ m', {role: 'work', anchor: [580, 160], until: 'end', pin: true});
Shell.label(s1, 610, 245, '$5$ m', {role: 'given', anchor: [610, 230], until: 'end', pin: true});
Shell.label(s1, 625, 150, '$13$ m', {role: 'given', anchor: [610, 160], until: 'end', pin: true});
Shell.label(s1, 620, 275, '$5^2 + y_1^2 = 13^2 \\implies y_1 = 12$ m', {role: 'work', anchor: [620, 275], until: 'end', pin: true});

// -------------------------------------------------------------------------
// ขั้นที่ 2: เลื่อนฐานบันไดออกไปอีก 2 เมตร
// -------------------------------------------------------------------------
Shell.group('เลื่อนฐานบันไดและคำนวณความสูงใหม่ (สภาวะที่ 2)');

var s2 = Shell.step(
  'เลื่อนฐานบันไดห่างจากกำแพงออกไปอีก $2$ m:<br>ระยะห่างใหม่ของฐานบันไดคือ $x_2 = 5 + 2 = 7$ m โดยความยาวบันไดยังคงเป็น $L = 13$ m เท่าเดิม',
  {uses: [1], why: 'บันไดเป็นวัตถุเกร็ง ความยาวยังคงเท่าเดิมคือ $13$ m เมื่อเลื่อนฐานออกไป $2$ m ระยะห่างใหม่จึงกลายเป็น $7$ m'}
);

// ลูกศรบอกระยะที่เลื่อนออกไป 2 m
Shell.arrow(s2, 350, 465, 410, 465, {role: 'work', label: '$+2$ m', value: 2, unit: 'm', until: 'end'});

// ลูกศรบอกระยะฐานรวมใหม่ 7 m
Shell.arrow(s2, 200, 498, 410, 498, {role: 'work', label: '$x_2 = 7$ m', value: 7, unit: 'm', until: 'end'});

// บันไดเคลื่อนที่ตามการเลื่อนจริง
var movingLadderGrp = document.createElementNS(SVGNS, 'g');
s2.appendChild(movingLadderGrp);

var mRail1 = document.createElementNS(SVGNS, 'line');
mRail1.setAttribute('stroke', C.work);
mRail1.setAttribute('stroke-width', '3');
mRail1.setAttribute('stroke-linecap', 'round');
movingLadderGrp.appendChild(mRail1);

var mRail2 = document.createElementNS(SVGNS, 'line');
mRail2.setAttribute('stroke', C.work);
mRail2.setAttribute('stroke-width', '3');
mRail2.setAttribute('stroke-linecap', 'round');
movingLadderGrp.appendChild(mRail2);

var mRungs = [];
for (var ri = 0; ri < 9; ri++) {
  var rungElem = document.createElementNS(SVGNS, 'line');
  rungElem.setAttribute('stroke', C.work);
  rungElem.setAttribute('stroke-width', '2');
  movingLadderGrp.appendChild(rungElem);
  mRungs.push(rungElem);
}

function updateMovingLadder(xB, yB, xT, yT) {
  var dx = xT - xB, dy = yT - yB;
  var len = Math.hypot(dx, dy);
  var ux = dx / len, uy = dy / len;
  var nx = -uy, ny = ux;
  var w = 5;
  mRail1.setAttribute('x1', xB - nx * w); mRail1.setAttribute('y1', yB - ny * w);
  mRail1.setAttribute('x2', xT - nx * w); mRail1.setAttribute('y2', yT - ny * w);
  mRail2.setAttribute('x1', xB + nx * w); mRail2.setAttribute('y1', yB + ny * w);
  mRail2.setAttribute('x2', xT + nx * w); mRail2.setAttribute('y2', yT + ny * w);
  for (var k = 0; k < mRungs.length; k++) {
    var f = (k + 1) / (mRungs.length + 1);
    var cx = xB + dx * f, cy = yB + dy * f;
    mRungs[k].setAttribute('x1', cx - nx * w); mRungs[k].setAttribute('y1', cy - ny * w);
    mRungs[k].setAttribute('x2', cx + nx * w); mRungs[k].setAttribute('y2', cy + ny * w);
  }
}

// ค่าตั้งต้นที่ตำแหน่งสุดท้ายเพื่อความถูกต้องเมื่อปิดแอนิเมชัน
updateMovingLadder(410, 440, 200, 440 - Math.sqrt(120) * PX_PER_M);

Shell.motion(s2, null, function(t) {
  var dBase = 5 + 2 * t;
  return [200 + dBase * PX_PER_M, 440];
}, {
  dur: 1300,
  onFrame: function(pt, t) {
    var dBase = 5 + 2 * t;
    var xB = 200 + dBase * PX_PER_M;
    var yB = 440;
    var xT = 200;
    var hWall = Math.sqrt(169 - dBase * dBase);
    var yT = 440 - hWall * PX_PER_M;
    updateMovingLadder(xB, yB, xT, yT);
  }
});

Shell.label(s2, 345, 290, 'บันไดใหม่ ($13$ m)', {role: 'work', anchor: [305, 275], until: 'end'});

// -------------------------------------------------------------------------
// ขั้นที่ 3: คำนวณความสูงใหม่ของปลายบันได
// -------------------------------------------------------------------------
var s3 = Shell.step(
  'คำนวณความสูงใหม่ของปลายบันได $y_2$ จากทฤษฎีบทพีทาโกรัสในสภาวะใหม่:<br>$7^2 + y_2^2 = 13^2 \\implies 49 + y_2^2 = 169 \\implies y_2 = \\sqrt{120} = 2\\sqrt{30} \\approx 10.95$ m',
  {uses: [2], why: 'รูปสามเหลี่ยมใหม่ยังคงเป็นรูปสามเหลี่ยมมุมฉากที่มีด้านตรงข้ามมุมฉาก $13$ m และฐาน $7$ m จึงใช้ทฤษฎีบทพีทาโกรัสหาความสูงใหม่ได้'}
);

// ลูกศรบอกความสูงใหม่ y2
Shell.arrow(s3, 150, 440, 150, 111.5, {role: 'work', label: '$y_2 \\approx 10.95$ m', value: 10.95, unit: 'm', until: 'end'});

// รูปสามเหลี่ยมสภาวะที่ 2 ด้านขวา
var tri2 = document.createElementNS(SVGNS, 'g');
s3.appendChild(tri2);

Shell.label(s3, 800, 60, 'สภาวะที่ 2 (ใหม่)', {role: 'work', anchor: [800, 60], until: 'end', pin: true});

var pathT2 = document.createElementNS(SVGNS, 'path');
pathT2.setAttribute('d', 'M 750 102 L 750 230 L 834 230 Z');
pathT2.setAttribute('stroke', C.work);
pathT2.setAttribute('stroke-width', '2.5');
pathT2.setAttribute('fill', 'none');
tri2.appendChild(pathT2);

var ra2 = document.createElementNS(SVGNS, 'path');
ra2.setAttribute('d', 'M 750 216 L 764 216 L 764 230');
ra2.setAttribute('stroke', C.note);
ra2.setAttribute('fill', 'none');
tri2.appendChild(ra2);

Shell.label(s3, 705, 165, '$y_2 \\approx 10.95$ m', {role: 'work', anchor: [750, 165], until: 'end', pin: true});
Shell.label(s3, 792, 245, '$7$ m', {role: 'work', anchor: [792, 230], until: 'end', pin: true});
Shell.label(s3, 810, 155, '$13$ m', {role: 'given', anchor: [792, 165], until: 'end', pin: true});
Shell.label(s3, 800, 275, '$7^2 + y_2^2 = 13^2 \\implies y_2 = \\sqrt{120}$ m', {role: 'work', anchor: [800, 275], until: 'end', pin: true});

// -------------------------------------------------------------------------
// ขั้นที่ 4: หาระยะที่ปลายบันไดเลื่อนลงมา
// -------------------------------------------------------------------------
Shell.group('เปรียบเทียบหาระยะที่ปลายบันไดเลื่อนลงมา');

var s4 = Shell.step(
  'หาระยะที่ปลายบันไดเลื่อนลงมาจากเดิม ($\\Delta y$):<br>$\\Delta y = y_1 - y_2 = 12 - \\sqrt{120} = 12 - 2\\sqrt{30} \\approx 12 - 10.95 = 1.05$ m',
  {uses: [1, 3], why: 'ระยะที่ปลายบันไดเลื่อนลงมาคือผลต่างระหว่างระดับความสูงเดิมกับระดับความสูงใหม่บนกำแพง'}
);

// ลูกศรบอกระยะเลื่อนลงมาบนกำแพง
Shell.arrow(s4, 215, 80, 215, 111.5, {role: 'answer', label: '$\\Delta y \\approx 1.05$ m', value: 1.05, unit: 'm', until: 'end'});

// ตารางสรุปเปรียบเทียบสองสภาวะ
Shell.table(s4, 520, 320, [
  ['สภาวะ', 'ฐาน ($x$)', 'บันได ($L$)', 'ความสูง ($y$)'],
  ['เดิม (1)', '$5$ m', '$13$ m', '$12$ m'],
  ['ใหม่ (2)', '$7$ m', '$13$ m', '$\\sqrt{120} \\approx 10.95$ m'],
  ['ผลต่าง', '$+2$ m', '$0$ m', 'เลื่อนลง $1.05$ m']
], {roles: ['note', 'given', 'work', 'answer'], colW: [85, 80, 85, 140], rowH: 34});

Shell.label(s4, 715, 485, '$\\Delta y = 12 - \\sqrt{120} \\approx 1.05$ m', {role: 'answer', anchor: [715, 485], until: 'end', pin: true});

// -------------------------------------------------------------------------
// กล่องคำตอบ
// -------------------------------------------------------------------------
Shell.answer(
  'ระยะที่ปลายบันไดเลื่อนลงมาจากเดิม',
  '$12 - 2\\sqrt{30} \\approx 1.05$ m',
  {sanity: 'ระยะที่เลื่อนลงมา ($1.05$ m) น้อยกว่าระยะที่ฐานเลื่อนออก ($2$ m) เนื่องจากบันไดอยู่ในแนวค่อนข้างชัน ($12 > 5$)'}
);

Shell.done();
</script>
</body></html>
