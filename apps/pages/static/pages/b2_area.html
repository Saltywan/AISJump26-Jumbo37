<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>พื้นที่ปิดล้อมด้วยเส้นโค้งและเส้นตรง</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/jsxgraph.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/jsxgraphcore.js"></script>
<script src="./lib/shell.js"></script>
<script>
Shell.page({
  title: 'พื้นที่ปิดล้อมด้วยเส้นโค้งและเส้นตรง',
  problem: 'จงหาพื้นที่ของบริเวณที่ปิดล้อมด้วยเส้นโค้ง $y = 4 - x^2$ และเส้นตรง $y = x + 2$',
  level: 'ม.6'
});

var b = Shell.board({
  box: [-3.5, 5.5, 2.5, -1.5],
  axis: true,
  grid: true,
  keepaspect: true
});
var C = Shell.C;

Shell.setup('การหาพื้นที่ระหว่างเส้นกราฟสองเส้น ต้องหาจุดตัดของทั้งสองกราฟก่อนเพื่อกำหนดช่วงของการอินทิเกรต จากนั้นอินทิเกรตผลต่างของฟังก์ชันบนลบด้วยฟังก์ชันล่าง');

var f = b.create('functiongraph', [function(x) { return 4 - x * x; }, -3.5, 2.5], {
  strokeColor: C.given,
  strokeWidth: 2.5
});

var g = b.create('functiongraph', [function(x) { return x + 2; }, -3.5, 2.5], {
  strokeColor: C.given,
  strokeWidth: 2.5
});

var p1 = b.create('intersection', [f, g, 0], {
  strokeColor: C.work,
  fillColor: C.work,
  size: 4
});

var p2 = b.create('intersection', [f, g, 1], {
  strokeColor: C.work,
  fillColor: C.work,
  size: 4
});

var area = b.create('integral', [[function() { return p1.X(); }, function() { return p2.X(); }], f], {
  baseCurve: g,
  strokeColor: 'transparent',
  fillColor: C.answer,
  fillOpacity: 0.35
});

Shell.group('สร้างกราฟและหาจุดตัดของเส้นทั้งสอง');

var s1 = Shell.step('วาดกราฟพาราโบลาคว่ำ $y = 4 - x^2$ และเส้นตรง $y = x + 2$');
Shell.on(s1, f, g);
Shell.tag(s1, [0.2, 4.2], '$y = 4 - x^2$', {role: 'given'});
Shell.tag(s1, [-0.5, 1.8], '$y = x + 2$', {role: 'given'});

var s2 = Shell.step('หาจุดตัดของกราฟทั้งสองโดยแก้ระบบสมการ $4 - x^2 = x + 2$<br>จัดรูปสมการกำลังสองได้ $x^2 + x - 2 = 0$<br>แยกตัวประกอบ $(x + 2)(x - 1) = 0$ ได้ $x = -2, 1$', {
  why: 'จุดตัดทั้งสองจุดคือขอบเขตล่างและขอบเขตบนของการอินทิเกรตตามแนวแกน $x$',
  uses: [1]
});
Shell.on(s2, p1, p2);
Shell.tag(s2, p1, '(-2, 0)', {role: 'work'});
Shell.tag(s2, p2, '(1, 3)', {role: 'work'});

Shell.group('ตั้งสมการและคำนวณอินทิกรัลจำกัดเขต');

var s3 = Shell.step('พิจารณาช่วง $[-2, 1]$ พบว่าเส้นโค้ง $y = 4 - x^2$ อยู่เหนือเส้นตรง $y = x + 2$ เสมอ', {
  why: 'การหาพื้นที่ต้องนำฟังก์ชันบนลบด้วยฟังก์ชันล่าง เพื่อให้ผลลัพธ์เป็นค่าบวก',
  uses: [2]
});

var s4 = Shell.step('ตั้งสมการอินทิเกรตหาพื้นที่ $A$:<br>$A = \\int_{-2}^{1} [(4 - x^2) - (x + 2)]\\,dx = \\int_{-2}^{1} (2 - x - x^2)\\,dx$', {
  why: 'หาผลรวมของพื้นที่แถบสี่เหลี่ยมแนวดิ่งความสูง $y_{\\text{top}} - y_{\\text{bottom}}$ จาก $x = -2$ ถึง $x = 1$',
  uses: [3]
});

var s5 = Shell.step('หาปฏิยานุพันธ์และแทนค่าขอบเขต:<br>$\\left[ 2x - \\frac{x^2}{2} - \\frac{x^3}{3} \\right]_{-2}^{1} = \\left(2 - \\frac{1}{2} - \\frac{1}{3}\\right) - \\left(-4 - 2 + \\frac{8}{3}\\right) = \\frac{7}{6} - \\left(-\\frac{10}{3}\\right) = \\frac{27}{6}$', {
  uses: [4]
});
Shell.on(s5, area);

Shell.answer('พื้นที่ของบริเวณที่ปิดล้อม', '$A = \\frac{9}{2} = 4.5$ ตารางหน่วย', {
  sanity: 'สอดคล้องกับสูตรพื้นที่ส่วนโค้งพาราโบลา $\\frac{1}{6}(b - a)^3 = \\frac{1}{6}(1 - (-2))^3 = \\frac{27}{6} = 4.5$'
});

Shell.done();
</script>
</body></html>
