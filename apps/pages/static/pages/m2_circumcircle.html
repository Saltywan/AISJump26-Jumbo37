<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>การสร้างวงกลมล้อมรอบสามเหลี่ยม</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

Shell.page({
  title: 'การสร้างวงกลมล้อมรอบสามเหลี่ยม (Circumcircle)',
  problem: 'สามเหลี่ยม $ABC$ มีจุดยอด $A(-2, 1)$, $B(6, 1)$, $C(1, 6)$ จงสร้างเส้นแบ่งครึ่งตั้งฉากของด้านทั้งสาม หาจุดศูนย์กลางวงกลมล้อมรอบ และวาดวงกลมล้อมรอบสามเหลี่ยม พร้อมบอกพิกัดจุดศูนย์กลางและรัศมี',
  level: 'ม.4'
});

var g = Shell.canvas();
var C = Shell.C;

// ฟังก์ชันแปลงพิกัดทางคณิตศาสตร์เป็นพิกัด SVG (Canvas 960 x 540)
var SCALE = 42;
var ORIGIN_X = 480;
var ORIGIN_Y = 260;
var CENTER_MATH_X = 2;
var CENTER_MATH_Y = 3.2;

function toSvg(x, y) {
  return [
    ORIGIN_X + (x - CENTER_MATH_X) * SCALE,
    ORIGIN_Y - (y - CENTER_MATH_Y) * SCALE
  ];
}

function createLine(p1, p2, color, width, dash) {
  var line = document.createElementNS(SVGNS, 'line');
  line.setAttribute('x1', p1[0]);
  line.setAttribute('y1', p1[1]);
  line.setAttribute('x2', p2[0]);
  line.setAttribute('y2', p2[1]);
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', width || 2);
  if (dash) line.setAttribute('stroke-dasharray', dash);
  return line;
}

function createDot(p, color, r) {
  var circle = document.createElementNS(SVGNS, 'circle');
  circle.setAttribute('cx', p[0]);
  circle.setAttribute('cy', p[1]);
  circle.setAttribute('r', r || 4.5);
  circle.setAttribute('fill', color);
  return circle;
}

function createRightAngle(vertex, dir1, dir2, size, color) {
  var group = document.createElementNS(SVGNS, 'g');
  var s = size || 10;
  var len1 = Math.hypot(dir1[0], dir1[1]);
  var len2 = Math.hypot(dir2[0], dir2[1]);
  var u1 = [dir1[0] / len1 * s, dir1[1] / len1 * s];
  var u2 = [dir2[0] / len2 * s, dir2[1] / len2 * s];
  var p1 = [vertex[0] + u1[0], vertex[1] + u1[1]];
  var p2 = [vertex[0] + u1[0] + u2[0], vertex[1] + u1[1] + u2[1]];
  var p3 = [vertex[0] + u2[0], vertex[1] + u2[1]];
  
  var poly = document.createElementNS(SVGNS, 'polyline');
  poly.setAttribute('points', p1[0] + ',' + p1[1] + ' ' + p2[0] + ',' + p2[1] + ' ' + p3[0] + ',' + p3[1]);
  poly.setAttribute('stroke', color || C.work);
  poly.setAttribute('fill', 'none');
  poly.setAttribute('stroke-width', '1.5');
  group.appendChild(poly);
  return group;
}

Shell.setup('จุดศูนย์กลางของวงกลมล้อมรอบสามเหลี่ยม (Circumcenter) คือจุดตัดของเส้นแบ่งครึ่งและตั้งฉากกับด้านทั้งสาม (Perpendicular Bisector) ซึ่งจุดนี้จะอยู่ห่างจากจุดยอดทั้งสามเท่ากันเป็นระยะรัศมี $R$');

// วาดระบบแกนพิกัดฉากฉากหลัง
var bgGroup = document.createElementNS(SVGNS, 'g');
g.appendChild(bgGroup);

for (var xVal = -4; xVal <= 8; xVal++) {
  var pTop = toSvg(xVal, 7.5);
  var pBot = toSvg(xVal, -1);
  bgGroup.appendChild(createLine(pTop, pBot, C.note, 0.6, '2,3'));
}
for (var yVal = -1; yVal <= 7; yVal++) {
  var pLeft = toSvg(-4.5, yVal);
  var pRight = toSvg(8.5, yVal);
  bgGroup.appendChild(createLine(pLeft, pRight, C.note, 0.6, '2,3'));
}

var xAxisStart = toSvg(-4.5, 0);
var xAxisEnd = toSvg(8.5, 0);
var yAxisStart = toSvg(0, -1);
var yAxisEnd = toSvg(0, 7.5);
bgGroup.appendChild(createLine(xAxisStart, xAxisEnd, C.note, 1.2));
bgGroup.appendChild(createLine(yAxisStart, yAxisEnd, C.note, 1.2));
Shell.label(bgGroup, xAxisEnd[0] + 12, xAxisEnd[1], '$x$', {role: 'note', anchor: xAxisEnd, until: 'end'});
Shell.label(bgGroup, yAxisEnd[0], yAxisEnd[1] - 12, '$y$', {role: 'note', anchor: yAxisEnd, until: 'end'});

var ptA = toSvg(-2, 1);
var ptB = toSvg(6, 1);
var ptC = toSvg(1, 6);
var ptO = toSvg(2, 2);

var ptM_AB = toSvg(2, 1);
var ptM_BC = toSvg(3.5, 3.5);
var ptM_CA = toSvg(-0.5, 3.5);

Shell.group('พล็อตจุดยอดและสร้างรูปสามเหลี่ยม ABC');

var s1 = Shell.step('พล็อตจุดยอด $A(-2, 1)$, $B(6, 1)$, $C(1, 6)$ และลากเส้นเชื่อมสร้างรูปสามเหลี่ยม $ABC$');
var triPolygon = document.createElementNS(SVGNS, 'polygon');
triPolygon.setAttribute('points', ptA[0] + ',' + ptA[1] + ' ' + ptB[0] + ',' + ptB[1] + ' ' + ptC[0] + ',' + ptC[1]);
triPolygon.setAttribute('stroke', C.given);
triPolygon.setAttribute('stroke-width', '2.5');
triPolygon.setAttribute('fill', C.given);
triPolygon.setAttribute('fill-opacity', '0.08');
s1.appendChild(triPolygon);

s1.appendChild(createDot(ptA, C.given, 5));
s1.appendChild(createDot(ptB, C.given, 5));
s1.appendChild(createDot(ptC, C.given, 5));

Shell.label(s1, ptA[0] - 16, ptA[1] + 18, '$A(-2, 1)$', {role: 'given', anchor: ptA, until: 'end'});
Shell.label(s1, ptB[0] + 16, ptB[1] + 18, '$B(6, 1)$', {role: 'given', anchor: ptB, until: 'end'});
Shell.label(s1, ptC[0], ptC[1] - 18, '$C(1, 6)$', {role: 'given', anchor: ptC, until: 'end'});

Shell.group('สร้างเส้นแบ่งครึ่งตั้งฉากของด้านทั้งสาม');

var s2 = Shell.step('หาจุดกึ่งกลางของด้าน $AB$ คือ $M_{AB}(2, 1)$ และสร้างเส้นแบ่งครึ่งตั้งฉาก $L_1: x = 2$', {
  why: 'ด้าน $AB$ ขนานกับแกน $x$ ($y = 1$) จุดกึ่งกลางคือ $(2, 1)$ เส้นตั้งฉากจึงเป็นเส้นตรงแนวดิ่ง $x = 2$',
  uses: [1]
});
s2.appendChild(createDot(ptM_AB, C.work, 4));
var lineL1_top = toSvg(2, 7.2);
var lineL1_bot = toSvg(2, -0.8);
s2.appendChild(createLine(lineL1_top, lineL1_bot, C.work, 1.8, '6,4'));
s2.appendChild(createRightAngle(ptM_AB, [1, 0], [0, -1], 10, C.work));
Shell.label(s2, ptM_AB[0] + 14, ptM_AB[1] + 16, '$M_{AB}(2, 1)$', {role: 'work', anchor: ptM_AB, until: 'step'});
Shell.label(s2, lineL1_top[0] + 12, lineL1_top[1] + 6, '$L_1: x = 2$', {role: 'work', anchor: lineL1_top, until: 'step'});

var s3 = Shell.step('หาจุดกึ่งกลางของด้าน $BC$ คือ $M_{BC}(3.5, 3.5)$ และสร้างเส้นแบ่งครึ่งตั้งฉาก $L_2: y = x$', {
  why: 'ความชัน $BC = -1$ เส้นตั้งฉากจึงมีความชัน $1$ ผ่านจุดกึ่งกลาง $(3.5, 3.5)$ ทำให้ได้สมการ $y = x$',
  uses: [1]
});
s3.appendChild(createDot(ptM_BC, C.work, 4));
var lineL2_p1 = toSvg(-1, -1);
var lineL2_p2 = toSvg(7, 7);
s3.appendChild(createLine(lineL2_p1, lineL2_p2, C.work, 1.8, '6,4'));
s3.appendChild(createRightAngle(ptM_BC, [1, -1], [-1, -1], 10, C.work));
Shell.label(s3, ptM_BC[0] + 18, ptM_BC[1] - 12, '$M_{BC}(3.5, 3.5)$', {role: 'work', anchor: ptM_BC, until: 'step'});
Shell.label(s3, lineL2_p2[0] + 14, lineL2_p2[1] - 4, '$L_2: y = x$', {role: 'work', anchor: lineL2_p2, until: 'step'});

var s4 = Shell.step('หาจุดกึ่งกลางของด้าน $CA$ คือ $M_{CA}(-0.5, 3.5)$ และสร้างเส้นแบ่งครึ่งตั้งฉาก $L_3: y = -0.6x + 3.2$', {
  why: 'ความชัน $CA = \\frac{5}{3}$ เส้นตั้งฉากมีความชัน $-\\frac{3}{5} = -0.6$ ผ่านจุด $(-0.5, 3.5)$ ได้สมการ $y = -0.6x + 3.2$',
  uses: [1]
});
s4.appendChild(createDot(ptM_CA, C.work, 4));
var lineL3_p1 = toSvg(-3.5, 5.3);
var lineL3_p2 = toSvg(6.5, -0.7);
s4.appendChild(createLine(lineL3_p1, lineL3_p2, C.work, 1.8, '6,4'));
s4.appendChild(createRightAngle(ptM_CA, [3, 5], [-5, 3], 10, C.work));
Shell.label(s4, ptM_CA[0] - 16, ptM_CA[1] - 12, '$M_{CA}(-0.5, 3.5)$', {role: 'work', anchor: ptM_CA, until: 'step'});
Shell.label(s4, lineL3_p1[0] - 12, lineL3_p1[1] - 10, '$L_3$', {role: 'work', anchor: lineL3_p1, until: 'step'});

Shell.group('หาจุดศูนย์กลางและวาดวงกลมล้อมรอบ');

var s5 = Shell.step('หาจุดตัดของเส้นแบ่งครึ่งตั้งฉาก จะได้พิกัดจุดศูนย์กลางวงกลมล้อมรอบ $O(2, 2)$', {
  why: 'แก้ระบบสมการเส้นตรง $x = 2$ และ $y = x$ จะได้จุดตัดร่วมของเส้นแบ่งครึ่งตั้งฉากทั้งสามเส้นที่ $(2, 2)$',
  uses: [2, 3, 4]
});
s5.appendChild(createDot(ptO, C.answer, 6));
Shell.label(s5, ptO[0] + 16, ptO[1] + 16, '$O(2, 2)$', {role: 'answer', anchor: ptO, until: 'end'});

var s6 = Shell.step('คำนวณรัศมี $R = \\sqrt{17} \\approx 4.12$ หน่วย และวาดวงกลมล้อมรอบสามเหลี่ยม $ABC$', {
  why: 'รัศมี $R$ คือระยะจากจุดศูนย์กลาง $O(2, 2)$ ไปยังจุดยอด $A(-2, 1)$ โดย $R = \\sqrt{(2 - (-2))^2 + (2 - 1)^2} = \\sqrt{17}$',
  uses: [1, 5]
});

var radiusPx = Math.sqrt(17) * SCALE;
var circumCircle = document.createElementNS(SVGNS, 'circle');
circumCircle.setAttribute('cx', ptO[0]);
circumCircle.setAttribute('cy', ptO[1]);
circumCircle.setAttribute('r', radiusPx);
circumCircle.setAttribute('stroke', C.answer);
circumCircle.setAttribute('stroke-width', '2.5');
circumCircle.setAttribute('fill', C.answer);
circumCircle.setAttribute('fill-opacity', '0.05');
s6.appendChild(circumCircle);

// รัศมีเชื่อมไปยังจุดยอดทั้งสาม
s6.appendChild(createLine(ptO, ptA, C.answer, 1.4, '4,3'));
s6.appendChild(createLine(ptO, ptB, C.answer, 1.4, '4,3'));
s6.appendChild(createLine(ptO, ptC, C.answer, 1.4, '4,3'));

var radiusMidA = [(ptO[0] + ptA[0]) / 2, (ptO[1] + ptA[1]) / 2];
Shell.label(s6, radiusMidA[0] - 14, radiusMidA[1] - 12, '$R = \\sqrt{17}$', {role: 'answer', anchor: radiusMidA, until: 'end'});

Shell.answer('จุดศูนย์กลางวงกลมล้อมรอบ', 'พิกัด $O(2, 2)$', {
  sanity: 'พิกัด $x = 2$ อยู่กึ่งกลางระหว่าง $x_A = -2$ และ $x_B = 6$ พอดีตามแนวสมมาตร'
});

Shell.answer('รัศมีวงกลมล้อมรอบ', '$R = \\sqrt{17} \\approx 4.12$ หน่วย', {
  sanity: 'ระยะห่างจาก $O(2, 2)$ ไปยังจุดยอดทั้งสามเท่ากัน: $OA = OB = OC = \\sqrt{(\\pm 4)^2 + (\\pm 1)^2} = \\sqrt{17}$'
});

Shell.done();
</script>
</body></html>
