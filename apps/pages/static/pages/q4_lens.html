<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>การเกิดภาพจากเลนส์นูน</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

Shell.page({
  title: 'การเกิดภาพจากเลนส์นูน (Ray Diagram)',
  problem: 'วัตถุสูง $4$ cm วางอยู่หน้าเลนส์นูนที่มีความยาวโฟกัส $10$ cm เป็นระยะ $30$ cm จงเขียนทางเดินของแสง (ray diagram) โดยใช้รังสีหลักอย่างน้อย 2 เส้น แล้วหาตำแหน่งของภาพ ขนาดของภาพ และบอกชนิดของภาพ',
  level: 'ม.3'
});

var g = Shell.canvas();
var C = Shell.C;

// มาตราส่วน: แนวนอน 1 cm = 12 px, แนวตั้ง 1 cm = 20 px
var PX_X = 12;
var PX_Y = 20;

var CX = 480; // กึ่งกลางเลนส์ (จุด O)
var CY = 270; // แกนมุขสำคัญ (Principal axis)

var f_val = 10;
var s_val = 30;
var h_val = 4;
var sp_val = 15;
var hp_val = 2;

var x_obj = CX - s_val * PX_X;   // 480 - 360 = 120
var y_obj_top = CY - h_val * PX_Y; // 270 - 80 = 190

var x_f1 = CX - f_val * PX_X;     // 480 - 120 = 360
var x_2f1 = CX - 2 * f_val * PX_X; // 480 - 240 = 240

var x_f2 = CX + f_val * PX_X;     // 480 + 120 = 600
var x_2f2 = CX + 2 * f_val * PX_X; // 480 + 240 = 720

var x_img = CX + sp_val * PX_X;   // 480 + 180 = 660
var y_img_tip = CY + hp_val * PX_Y; // 270 + 40 = 310

Shell.setup('เลือกใช้จุดกึ่งกลางเลนส์ $O$ เป็นจุดกำเนิด ($x = 0$) และแกนมุขสำคัญเป็นแกนอ้างอิง ($y = 0$) เพื่อเขียนแผนภาพรังสีแสงตามกฎการหักเหของเลนส์บาง');

// -------------------------------------------------------------
// กลุ่ม 1: วางแกนมุขสำคัญและระบุตำแหน่งสำคัญของเลนส์
// -------------------------------------------------------------
Shell.group('โครงสร้างของเลนส์และจุดโฟกัส');

var s1 = Shell.step('วาดแกนมุขสำคัญ เลนส์นูน จุดโฟกัส $F$ และจุด $2F$ ทั้งสองด้านของเลนส์ ($f = 10$ cm)');

// แกนมุขสำคัญ
var axis = document.createElementNS(SVGNS, 'line');
axis.setAttribute('x1', '60');
axis.setAttribute('y1', String(CY));
axis.setAttribute('x2', '900');
axis.setAttribute('y2', String(CY));
axis.setAttribute('stroke', C.note);
axis.setAttribute('stroke-width', '2');
axis.setAttribute('stroke-dasharray', '6,4');
s1.appendChild(axis);

Shell.label(s1, 80, CY - 15, 'แกนมุขสำคัญ', {role:'note', anchor:[80, CY], until:'end'});

// ตัวเลนส์นูน (วาดเป็นรูปทรงเลนส์สองด้านโค้ง)
var lensShape = document.createElementNS(SVGNS, 'path');
var lensPath = 'M ' + CX + ' ' + (CY - 160) + ' ' +
               'Q ' + (CX + 24) + ' ' + CY + ' ' + CX + ' ' + (CY + 160) + ' ' +
               'Q ' + (CX - 24) + ' ' + CY + ' ' + CX + ' ' + (CY - 160) + ' Z';
lensShape.setAttribute('d', lensPath);
lensShape.setAttribute('fill', 'rgba(100, 180, 255, 0.2)');
lensShape.setAttribute('stroke', C.note);
lensShape.setAttribute('stroke-width', '2');
s1.appendChild(lensShape);

// เส้นแกนกลางเลนส์
var lensAxis = document.createElementNS(SVGNS, 'line');
lensAxis.setAttribute('x1', String(CX));
lensAxis.setAttribute('y1', String(CY - 170));
lensAxis.setAttribute('x2', String(CX));
lensAxis.setAttribute('y2', String(CY + 170));
lensAxis.setAttribute('stroke', C.note);
lensAxis.setAttribute('stroke-width', '1.5');
lensAxis.setAttribute('stroke-dasharray', '4,4');
s1.appendChild(lensAxis);

Shell.label(s1, CX, CY - 180, 'เลนส์นูน', {role:'note', anchor:[CX, CY - 160], until:'end'});
Shell.label(s1, CX - 15, CY + 20, '$O$', {role:'note', anchor:[CX, CY], until:'end'});

// จุดโฟกัส F1, 2F1, F2, 2F2
function addPoint(parent, x, y, name, labelOffset) {
  var dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('cx', String(x));
  dot.setAttribute('cy', String(y));
  dot.setAttribute('r', '4');
  dot.setAttribute('fill', C.given);
  parent.appendChild(dot);
  Shell.label(parent, x, y + labelOffset, name, {role:'given', anchor:[x, y], until:'end'});
}

addPoint(s1, x_2f1, CY, '$2F$', 20);
addPoint(s1, x_f1, CY, '$F$', 20);
addPoint(s1, x_f2, CY, '$F$', 20);
addPoint(s1, x_2f2, CY, '$2F$', 20);

// บอกระยะโฟกัส f = 10 cm
Shell.arrow(s1, CX, CY + 45, x_f2, CY + 45, {
  role: 'given',
  label: '$f = 10$ cm',
  value: 10,
  unit: 'cm',
  until: 'step'
});

// -------------------------------------------------------------
// กลุ่ม 2: วางตำแหน่งวัตถุ
// -------------------------------------------------------------
Shell.group('วางวัตถุหน้าเลนส์');

var s2 = Shell.step('วางวัตถุสูง $h = 4$ cm ที่ระยะ $s = 30$ cm หน้าเลนส์ ($s > 2f$)');

// ลูกศรแทนตัววัตถุ
Shell.arrow(s2, x_obj, CY, x_obj, y_obj_top, {
  role: 'given',
  label: '$h = 4$ cm',
  value: 4,
  unit: 'cm',
  until: 'end'
});

Shell.label(s2, x_obj, y_obj_top - 15, 'วัตถุ', {role:'given', anchor:[x_obj, y_obj_top], until:'end'});

// เส้นบอกระยะวัตถุ s = 30 cm
Shell.arrow(s2, x_obj, CY + 55, CX, CY + 55, {
  role: 'given',
  label: '$s = 30$ cm',
  value: 30,
  unit: 'cm',
  until: 'step'
});

// -------------------------------------------------------------
// กลุ่ม 3: เขียนทางเดินแสง (Ray Diagram)
// -------------------------------------------------------------
Shell.group('เขียนรังสีหลัก (Ray Diagram)');

var s3 = Shell.step('<b>รังสีที่ 1:</b> ลากจากยอดวัตถุขนานแกนมุขสำคัญไปยังเลนส์ แล้วหักเหผ่านจุดโฟกัส $F$ ด้านหลังเลนส์', {
  why: 'รังสีแสงที่ขนานแกนมุขสำคัญ เมื่อผ่านเลนส์นูนจะหักเหไปตัดที่จุดโฟกัสด้านตรงข้ามเสมอ'
});

// รังสีที่ 1 ช่วงก่อนถึงเลนส์ (ขนานแกน)
var ray1_in = document.createElementNS(SVGNS, 'line');
ray1_in.setAttribute('x1', String(x_obj));
ray1_in.setAttribute('y1', String(y_obj_top));
ray1_in.setAttribute('x2', String(CX));
ray1_in.setAttribute('y2', String(y_obj_top));
ray1_in.setAttribute('stroke', C.work);
ray1_in.setAttribute('stroke-width', '2.5');
s3.appendChild(ray1_in);

// หัวลูกศรบอกทิศทางบนรังสี 1 ก่อนเลนส์
var mid1_x = (x_obj + CX) / 2;
Shell.arrow(s3, mid1_x - 10, y_obj_top, mid1_x + 10, y_obj_top, {
  role: 'work',
  until: 'step'
});

// รังสีที่ 1 ช่วงหลังเลนส์ (ผ่าน F2 ไปจนเลยจุดตัด)
var x_ray1_end = 760;
var y_ray1_end = y_obj_top + ((CY - y_obj_top) / (x_f2 - CX)) * (x_ray1_end - CX); // 190 + (80/120)*280 = 376.67
var ray1_out = document.createElementNS(SVGNS, 'line');
ray1_out.setAttribute('x1', String(CX));
ray1_out.setAttribute('y1', String(y_obj_top));
ray1_out.setAttribute('x2', String(x_ray1_end));
ray1_out.setAttribute('y2', String(y_ray1_end));
ray1_out.setAttribute('stroke', C.work);
ray1_out.setAttribute('stroke-width', '2.5');
s3.appendChild(ray1_out);

Shell.label(s3, CX + 60, y_obj_top - 15, 'รังสีที่ 1', {role:'work', anchor:[CX, y_obj_top], until:'step'});

var s4 = Shell.step('<b>รังสีที่ 2:</b> ลากจากยอดวัตถุผ่านจุดกึ่งกลางเลนส์ ($O$) เป็นเส้นตรงโดยไม่หักเห', {
  why: 'รังสีแสงที่ผ่านจุดกึ่งกลางของเลนส์บาง จะเดินทางเป็นแนวเส้นตรงโดยแทบไม่มีการเบี่ยงเบน'
});

// รังสีที่ 2 ลากตรงจากยอดวัตถุผ่าน O ไปถึงจุดตัด
var x_ray2_end = 760;
var y_ray2_end = CY + ((CY - y_obj_top) / (CX - x_obj)) * (x_ray2_end - CX); // 270 + (80/360)*280 = 332.22
var ray2 = document.createElementNS(SVGNS, 'line');
ray2.setAttribute('x1', String(x_obj));
ray2.setAttribute('y1', String(y_obj_top));
ray2.setAttribute('x2', String(x_ray2_end));
ray2.setAttribute('y2', String(y_ray2_end));
ray2.setAttribute('stroke', C.work);
ray2.setAttribute('stroke-width', '2.5');
s4.appendChild(ray2);

var mid2_x = (x_obj + CX) / 2;
var mid2_y = (y_obj_top + CY) / 2;
Shell.arrow(s4, mid2_x - 9, mid2_y - 2, mid2_x + 9, mid2_y + 2, {
  role: 'work',
  until: 'step'
});

Shell.label(s4, CX + 30, CY + 30, 'รังสีที่ 2', {role:'work', anchor:[CX, CY], until:'step'});

// -------------------------------------------------------------
// กลุ่ม 4: วิเคราะห์และคำนวณหาตำแหน่ง ขนาด และชนิดของภาพ
// -------------------------------------------------------------
Shell.group('หาตำแหน่ง ขนาด และชนิดของภาพ');

var s5 = Shell.step('จุดตัดของรังสีทั้งสองเกิดภาพจริงหัวกลับ ที่ระยะภาพ $s\' = 15$ cm และมีความสูงภาพ $h\' = 2$ cm', {
  uses: [3, 4]
});

// จุดตัดของรังสีแสง
var intersectDot = document.createElementNS(SVGNS, 'circle');
intersectDot.setAttribute('cx', String(x_img));
intersectDot.setAttribute('cy', String(y_img_tip));
intersectDot.setAttribute('r', '5');
intersectDot.setAttribute('fill', C.answer);
s5.appendChild(intersectDot);

// วาดลูกศรภาพ (หัวกลับ ชี้ลงล่าง)
Shell.arrow(s5, x_img, CY, x_img, y_img_tip, {
  role: 'answer',
  label: '$h\' = 2$ cm',
  value: 2,
  unit: 'cm',
  until: 'end'
});

Shell.label(s5, x_img, y_img_tip + 20, 'ภาพจริงหัวกลับ', {role:'answer', anchor:[x_img, y_img_tip], until:'end'});

// เส้นบอกระยะภาพ s' = 15 cm
Shell.arrow(s5, CX, CY + 60, x_img, CY + 60, {
  role: 'answer',
  label: '$s\' = 15$ cm',
  value: 15,
  unit: 'cm',
  until: 'end'
});

var s6 = Shell.step('ตรวจสอบด้วยสูตรเลนส์บาง:<br>$\ wood\\frac{1}{f} = \\frac{1}{s} + \\frac{1}{s\'} \\implies \\frac{1}{10} = \\frac{1}{30} + \\frac{1}{s\'} \\implies s\' = 15$ cm<br>กำลังขยาย $m = -\\frac{s\'}{s} = -\\frac{15}{30} = -0.5 \\implies h\' = |m|h = 0.5 \\times 4 = 2$ cm', {
  uses: [2, 5],
  why: 'ใช้สมการความสัมพันธ์ $\\frac{1}{f} = \\frac{1}{s} + \\frac{1}{s\'}$ เพื่อยืนยันความถูกต้องของตำแหน่งและขนาดภาพจากแผนภาพรังสี'
});

Shell.answer('ตำแหน่งของภาพ', '$s\' = +15$ cm (อยู่หลังเลนส์ $15$ cm)', {
  sanity: 'เมื่อวัตถุอยู่ไกลกว่า $2f$ ($s = 30 > 20$ cm) ภาพจริงที่ได้จะต้องอยู่ระหว่าง $F$ กับ $2F$ ($10 < s\' < 20$ cm) เสมอ'
});

Shell.answer('ขนาดและชนิดของภาพ', 'ภาพจริง หัวกลับ ขนาด $h\' = 2$ cm (ย่อลง $0.5$ เท่า)', {
  sanity: 'กำลังขยาย $|m| = \\frac{s\'}{s} = 0.5 < 1$ แสดงว่าขนาดของภาพต้องเล็กลงกว่าวัตถุตั้งต้น'
});

Shell.done();
</script>
</body></html>
