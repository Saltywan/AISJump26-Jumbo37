<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>สมการพาราโบลา</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/jsxgraph.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/jsxgraphcore.js"></script>
<script src="./lib/shell.js"></script>
<script>
Shell.page({
  title: 'สมการพาราโบลา',
  problem: 'จงหาสมการพาราโบลาที่มีจุดโฟกัสที่ $(0, 3)$ และไดเรกตริกซ์ $y = -3$'
});

var b = Shell.board({box: [-9, 8, 9, -5], axis: true, grid: true, keepaspect: true});
var C = Shell.C;

Shell.setup('พาราโบลาคือกราฟของจุดที่มีระยะห่างจากจุดโฟกัสเท่ากับระยะห่างจากเส้นไดเรกตริกซ์ โดยแกนสมมาตรจะตั้งฉากกับไดเรกตริกซ์และผ่านจุดโฟกัสเสมอ');

Shell.group('วิเคราะห์องค์ประกอบทางเรขาคณิต');

var F = b.create('point', [0, 3], {strokeColor: C.given, fillColor: C.given, size: 4, withLabel: false, fixed: true});
var d1 = b.create('point', [-15, -3], {visible: false, withLabel: false});
var d2 = b.create('point', [15, -3], {visible: false, withLabel: false});
var directrix = b.create('line', [d1, d2], {strokeColor: C.given, strokeWidth: 2, dash: 2, withLabel: false});

var s1 = Shell.step('ระบุตำแหน่งจุดโฟกัส $F(0, 3)$ และเส้นไดเรกตริกซ์ $y = -3$ ตามเงื่อนไขของโจทย์');
Shell.on(s1, F, directrix);
Shell.tag(s1, F, '$F(0, 3)$', {role: 'given'});
Shell.tag(s1, [4.5, -3], '$y = -3$', {role: 'given'});

var axis = b.create('perpendicular', [directrix, F], {strokeColor: C.note, strokeWidth: 1.5, dash: 3, withLabel: false});
var D0 = b.create('intersection', [axis, directrix, 0], {visible: false, withLabel: false});
var V = b.create('midpoint', [F, D0], {strokeColor: C.work, fillColor: C.work, size: 4, withLabel: false});

var s2 = Shell.step('สร้างแกนสมมาตรและหาจุดยอด $V(0, 0)$<br>• แกนสมมาตรคือเส้นตรงที่ผ่านจุดโฟกัสและตั้งฉากกับไดเรกตริกซ์ ซึ่งตรงกับแกน $y$ ($x = 0$)<br>• จุดยอด $V$ อยู่กึ่งกลางระหว่างจุดโฟกัส $(0, 3)$ กับจุดตัดบนไดเรกตริกซ์ $(0, -3)$ คือ $V(0, 0)$', {
  why: 'แกนสมมาตรตั้งฉากกับไดเรกตริกซ์และผ่านจุดโฟกัสเสมอ ส่วนจุดยอดคือจุดกึ่งกลางระหว่างจุดโฟกัสกับไดเรกตริกซ์',
  uses: [1]
});
Shell.on(s2, axis, V);
Shell.tag(s2, V, '$V(0, 0)$', {role: 'work'});
Shell.tag(s2, [0, 5.5], 'แกนสมมาตร $x = 0$', {role: 'note', until: 'step'});

Shell.group('สร้างสมการพาราโบลา');

var segC = b.create('segment', [V, F], {strokeColor: C.work, strokeWidth: 3, withLabel: false});

var s3 = Shell.step('คำนวณระยะโฟกัส $c$ และพิจารณาทิศทางการเปิดของพาราโบลา<br>• ระยะโฟกัส $c$ วัดจากจุดยอดไปยังจุดโฟกัส: $c = 3 - 0 = 3$<br>• จุดโฟกัสอยู่เหนือจุดยอด กราฟจึงเป็น<b>พาราโบลาหงาย</b>', {
  why: 'ระยะ $c$ กำหนดขนาดความกว้างและทิศทางการเปิดของพาราโบลา',
  uses: [2]
});
Shell.on(s3, segC, {until: 'step'});
Shell.tag(s3, [0.6, 1.5], '$c = 3$', {role: 'work', until: 'step'});

var para = b.create('parabola', [F, directrix], {strokeColor: C.answer, strokeWidth: 2.5, withLabel: false});

var s4 = Shell.step('แทนค่าในสมการรูปมาตรฐานของพาราโบลา<br>พาราโบลาหงายที่มีจุดยอดที่ $(h, k) = (0, 0)$ มีรูปมาตรฐานคือ:<br>$(x - h)^2 = 4c(y - k)$<br>แทนค่า $h = 0$, $k = 0$ และ $c = 3$:<br>$(x - 0)^2 = 4(3)(y - 0) \\implies x^2 = 12y$', {
  why: 'พาราโบลาที่มีจุดยอดอยู่ที่จุดกำเนิดและเปิดตามแนวดิ่งมีสมการมาตรฐานคือ $x^2 = 4cy$',
  uses: [2, 3]
});
Shell.on(s4, para);
Shell.tag(s4, [-5.5, 3.5], '$x^2 = 12y$', {role: 'answer'});

var P = b.create('point', [6, 3], {strokeColor: C.work, fillColor: C.work, size: 3.5, withLabel: false});
var Pdir = b.create('point', [6, -3], {visible: false, withLabel: false});
var segPF = b.create('segment', [F, P], {strokeColor: C.work, strokeWidth: 2, dash: 2, withLabel: false});
var segPD = b.create('segment', [P, Pdir], {strokeColor: C.work, strokeWidth: 2, dash: 2, withLabel: false});

var s5 = Shell.step('ตรวจสอบความถูกต้องด้วยนิยามเรขาคณิต $PF = PD$<br>พิจารณาจุด $P(6, 3)$ บนพาราโบลา (ที่ระดับเดียวกับจุดโฟกัส $y = 3$):<br>• ระยะห่างจากจุดโฟกัส: $PF = |6 - 0| = 6$<br>• ระยะห่างจากเส้นไดเรกตริกซ์: $PD = |3 - (-3)| = 6$<br>จะเห็นว่า $PF = PD = 6$ เป็นจริงตามนิยามทุกประการ', {
  why: 'จุดทุกจุดบนพาราโบลาต้องมีระยะห่างจากจุดโฟกัสและเส้นไดเรกตริกซ์เท่ากันเสมอ',
  uses: [4]
});
Shell.on(s5, P, segPF, segPD, {until: 'step'});
Shell.tag(s5, P, '$P(6, 3)$', {role: 'work', until: 'step'});
Shell.tag(s5, [3, 3.4], '$d_1 = 6$', {role: 'work', until: 'step'});
Shell.tag(s5, [6.6, 0], '$d_2 = 6$', {role: 'work', until: 'step'});

Shell.answer('สมการพาราโบลาคือ', '$x^2 = 12y$', {
  sanity: 'จุดยอดอยู่ที่ $(0, 0)$ และกราฟหงายขึ้น ค่า $y$ ต้องมากกว่าหรือเท่ากับ $0$ เสมอ ซึ่งสอดคล้องกับ $x^2 = 12y \\ge 0$'
});

Shell.done();
</script>
</body></html>
