<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>การสร้างวงกลมแนบในสามเหลี่ยม</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/jsxgraph.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/jsxgraphcore.js"></script>
<script src="./lib/shell.js"></script>
<script>
Shell.page({
  title: 'การสร้างวงกลมแนบในสามเหลี่ยม',
  problem: 'สามเหลี่ยม $ABC$ มีจุดยอด $A(0, 0)$, $B(8, 0)$, $C(0, 6)$ จงสร้างวงกลมแนบในสามเหลี่ยมนี้ และหาพิกัดจุดศูนย์กลางกับรัศมีของวงกลมแนบใน',
  level: 'ม.4'
});

var b = Shell.board({box: [-2, 8, 10, -2], grid: true, keepaspect: true}), C = Shell.C;

Shell.setup('จุดศูนย์กลางวงกลมแนบใน (Incenter) คือจุดตัดของเส้นแบ่งครึ่งมุมภายในทั้งสาม ซึ่งมีระยะห่างตั้งฉากไปยังด้านทั้งสามเท่ากันเป็นรัศมี $r$');

var A = b.create('point', [0, 0], {fixed: true, strokeColor: C.given, fillColor: C.given, size: 4, name: '', withLabel: false});
var B = b.create('point', [8, 0], {fixed: true, strokeColor: C.given, fillColor: C.given, size: 4, name: '', withLabel: false});
var Cp = b.create('point', [0, 6], {fixed: true, strokeColor: C.given, fillColor: C.given, size: 4, name: '', withLabel: false});

var tri = b.create('polygon', [A, B, Cp], {
  strokeColor: C.given,
  fillColor: C.given,
  fillOpacity: 0.08,
  borders: {strokeColor: C.given, strokeWidth: 2},
  name: '',
  withLabel: false
});

Shell.group('สร้างรูปสามเหลี่ยมและหาความยาวด้าน');

var s1 = Shell.step('วางจุดยอด $A(0, 0)$, $B(8, 0)$, $C(0, 6)$ และลากรูปสามเหลี่ยมมุมฉาก $ABC$', {
  why: 'ด้าน $AB$ ทับแกน $x$ และด้าน $AC$ ทับแกน $y$ ตั้งฉากกันที่จุดกำเนิด $A(0, 0)$'
});
Shell.on(s1, A, B, Cp, tri);
Shell.tag(s1, A, 'A(0, 0)', {role: 'given'});
Shell.tag(s1, B, 'B(8, 0)', {role: 'given'});
Shell.tag(s1, Cp, 'C(0, 6)', {role: 'given'});

var s2 = Shell.step('คำนวณความยาวด้านตรงข้ามมุมฉาก $BC = \\sqrt{8^2 + 6^2} = 10$ หน่วย', {
  why: 'ใช้ทฤษฎีบทพีทาโกรัสหาความยาวด้านที่เหลือเพื่อเตรียมนำไปคำนวณรัศมีวงกลมแนบใน',
  uses: [1]
});

Shell.group('สร้างเส้นแบ่งครึ่งมุมหาจุดศูนย์กลาง Incenter');

var bisA = b.create('bisector', [B, A, Cp], {strokeColor: C.work, dash: 2, strokeWidth: 1.5, name: '', withLabel: false});
var bisB = b.create('bisector', [A, B, Cp], {strokeColor: C.work, dash: 2, strokeWidth: 1.5, name: '', withLabel: false});
var I = b.create('intersection', [bisA, bisB, 0], {strokeColor: C.answer, fillColor: C.answer, size: 5, name: '', withLabel: false});

var s3 = Shell.step('สร้างเส้นแบ่งครึ่งมุม $\\angle A$ และ $\\angle B$ ตัดกันที่จุดศูนย์กลาง $I(2, 2)$', {
  why: 'จุดบนเส้นแบ่งครึ่งมุมอยู่ห่างจากแขนของมุมเท่ากัน จุดตัดจึงห่างจากทุกด้านเท่ากัน',
  uses: [1]
});
Shell.on(s3, bisA, bisB, I);
Shell.tag(s3, I, 'I(2, 2)', {role: 'answer'});

Shell.group('หารัศมีและสร้างวงกลมแนบใน');

var lineAB = b.create('line', [A, B], {visible: false, name: '', withLabel: false});
var perpAB = b.create('perpendicular', [lineAB, I], {visible: false, name: '', withLabel: false});
var ptD = b.create('intersection', [perpAB, lineAB, 0], {strokeColor: C.work, fillColor: C.work, size: 3, name: '', withLabel: false});
var segRadius = b.create('segment', [I, ptD], {strokeColor: C.work, strokeWidth: 2, dash: 2, name: '', withLabel: false});

var s4 = Shell.step('ลากส่วนของเส้นตรงตั้งฉากจาก $I$ ไปยังด้าน $AB$ ได้รัศมี $r = 2$ หน่วย', {
  why: 'ระยะตั้งฉากจากจุดศูนย์กลาง $I(2, 2)$ ไปยังแกน $x$ คือค่าพิกัด $y = 2$',
  uses: [3]
});
Shell.on(s4, segRadius, ptD, {until: 'step'});
Shell.tag(s4, ptD, 'D(2, 0)', {role: 'work', until: 'step'});

var incircle = b.create('circle', [I, ptD], {
  strokeColor: C.answer,
  strokeWidth: 2.5,
  fillColor: C.answer,
  fillOpacity: 0.08,
  name: '',
  withLabel: false
});

var s5 = Shell.step('สร้างวงกลมแนบในที่มีจุดศูนย์กลาง $I(2, 2)$ และรัศมี $r = 2$ หน่วย', {
  why: 'วงกลมที่มีจุดศูนย์กลาง $I$ รัศมี $2$ สัมผัสกับด้านทั้งสามของสามเหลี่ยมพอดี',
  uses: [3, 4]
});
Shell.on(s5, incircle);

Shell.answer(
  'จุดศูนย์กลางและรัศมีของวงกลมแนบใน',
  'จุดศูนย์กลาง $I(2, 2)$ และรัศมี $r = 2$ หน่วย',
  {sanity: 'ตรงกับสูตรสำหรับสามเหลี่ยมมุมฉาก $r = \\frac{a+b-c}{2} = \\frac{8+6-10}{2} = 2$ หน่วย'}
);

Shell.done();
</script>
</body></html>
