<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>สมดุลของคานและโมเมนต์ของแรง</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

Shell.page({
  title: 'สมดุลของคานและโมเมนต์ของแรง',
  problem: 'คานสม่ำเสมอยาว $6$ m มวล $20$ kg วางพาดบนจุดหมุนที่จุดกึ่งกลางคาน มีมวล $40$ kg วางอยู่ห่างจากจุดหมุนไปทางซ้าย $2$ m จงเขียนแผนภาพคานแสดงแรงและระยะทาง แล้วหาว่าต้องวางมวล $30$ kg ห่างจากจุดหมุนไปทางขวากี่เมตร คานจึงจะอยู่ในสภาพสมดุล ($g = 10$ m/s²)',
  level: 'ม.4'
});

var g = Shell.canvas();
var C = Shell.C;

var PX_PER_M = 110;
var PX_PER_N = 0.3;

var PIVOT_X = 480;
var BEAM_Y = 270;
var BEAM_H = 16;
var BEAM_LEN = 6 * PX_PER_M; // 660 px
var BEAM_LEFT = PIVOT_X - BEAM_LEN / 2; // 150
var BEAM_RIGHT = PIVOT_X + BEAM_LEN / 2; // 810

Shell.setup('เลือกจุดกึ่งกลางคาน (ตำแหน่งของจุดหมุน) เป็นจุดหมุนอ้างอิง เพราะทำให้น้ำหนักของคานและแรงปฏิกิริยาที่จุดหมุนมีแขนของโมเมนต์เป็นศูนย์ ไม่ก่อให้เกิดโมเมนต์ จึงลดตัวแปรในการคำนวณ');

// ==========================================
// กลุ่มที่ 1: กำหนดจุดหมุนและระยะบนคาน
// ==========================================
Shell.group('กำหนดจุดหมุนและระยะบนคาน');

var s1 = Shell.step('วาดคานสม่ำเสมอยาว $6$ m วางบนจุดหมุนที่กึ่งกลาง ($3$ m จากแต่ละปลาย)');

// วาดพื้นรองรับและฐานจุดหมุน
var ground = document.createElementNS(SVGNS, 'line');
ground.setAttribute('x1', '100');
ground.setAttribute('y1', '350');
ground.setAttribute('x2', '860');
ground.setAttribute('y2', '350');
ground.setAttribute('stroke', C.note);
ground.setAttribute('stroke-width', '2');
ground.setAttribute('stroke-dasharray', '6 4');
s1.appendChild(ground);

// จุดหมุน (สามเหลี่ยม)
var pivot = document.createElementNS(SVGNS, 'polygon');
pivot.setAttribute('points', PIVOT_X + ',' + (BEAM_Y + BEAM_H) + ' ' + (PIVOT_X - 25) + ',350 ' + (PIVOT_X + 25) + ',350');
pivot.setAttribute('fill', '#e0e6ed');
pivot.setAttribute('stroke', C.note);
pivot.setAttribute('stroke-width', '2');
s1.appendChild(pivot);

// ตัวคาน
var beam = document.createElementNS(SVGNS, 'rect');
beam.setAttribute('x', BEAM_LEFT);
beam.setAttribute('y', BEAM_Y);
beam.setAttribute('width', BEAM_LEN);
beam.setAttribute('height', BEAM_H);
beam.setAttribute('rx', '4');
beam.setAttribute('fill', '#cbd5e1');
beam.setAttribute('stroke', C.note);
beam.setAttribute('stroke-width', '2');
s1.appendChild(beam);

Shell.label(s1, PIVOT_X, 368, 'จุดหมุน (กึ่งกลางคาน)', {role: 'note', anchor: [PIVOT_X, 350], until: 'end'});

// เส้นบอกระยะรวมของคาน
var dimBeam = document.createElementNS(SVGNS, 'line');
dimBeam.setAttribute('x1', BEAM_LEFT);
dimBeam.setAttribute('y1', '230');
dimBeam.setAttribute('x2', BEAM_RIGHT);
dimBeam.setAttribute('y2', '230');
dimBeam.setAttribute('stroke', C.note);
dimBeam.setAttribute('stroke-width', '1.5');
s1.appendChild(dimBeam);

Shell.label(s1, PIVOT_X, 215, 'ความยาวคานทั้งหมด $L = 6$ m', {role: 'note', anchor: [PIVOT_X, 230], until: 'step'});

// ==========================================
// กลุ่มที่ 2: เขียนแรงที่กระทำบนคาน (FBD)
// ==========================================
Shell.group('เขียนแรงที่กระทำบนคาน');

// ขั้นที่ 2: มวล 40 kg ทางซ้าย และน้ำหนักคาน 20 kg
var s2 = Shell.step('วางมวล $m_1 = 40$ kg ห่างจากจุดหมุนไปทางซ้าย $2$ m ($W_1 = 400$ N) และน้ำหนักคาน $W_0 = 200$ N ที่จุดกึ่งกลาง', {
  why: 'คานสม่ำเสมอน้ำหนักจะผ่านจุดศูนย์กลางมวลที่กึ่งกลางพอดี น้ำหนักจึงกระทำที่ตำแหน่งเดียวกับจุดหมุน'
});

var x1 = PIVOT_X - 2 * PX_PER_M; // 260
var box1 = document.createElementNS(SVGNS, 'rect');
box1.setAttribute('x', x1 - 20);
box1.setAttribute('y', BEAM_Y - 30);
box1.setAttribute('width', '40');
box1.setAttribute('height', '30');
box1.setAttribute('rx', '3');
box1.setAttribute('fill', '#93c5fd');
box1.setAttribute('stroke', C.given);
box1.setAttribute('stroke-width', '2');
s2.appendChild(box1);

Shell.label(s2, x1, BEAM_Y - 40, '$40$ kg', {role: 'given', anchor: [x1, BEAM_Y - 30], until: 'end'});

// ลูกศรน้ำหนักมวล 1
Shell.arrow(s2, x1, BEAM_Y + BEAM_H, x1, BEAM_Y + BEAM_H + 400 * PX_PER_N, {
  role: 'given',
  label: '$W_1 = 400$ N',
  value: 400,
  unit: 'N',
  until: 'end'
});

// ลูกศรน้ำหนักคาน
Shell.arrow(s2, PIVOT_X, BEAM_Y + BEAM_H, PIVOT_X, BEAM_Y + BEAM_H + 200 * PX_PER_N, {
  role: 'given',
  label: '$W_0 = 200$ N',
  value: 200,
  unit: 'N',
  until: 'step'
});

// เส้นบอกระยะ 2 m ทางซ้าย
var dimL = document.createElementNS(SVGNS, 'line');
dimL.setAttribute('x1', x1);
dimL.setAttribute('y1', '245');
dimL.setAttribute('x2', PIVOT_X);
dimL.setAttribute('y2', '245');
dimL.setAttribute('stroke', C.given);
dimL.setAttribute('stroke-width', '1.5');
s2.appendChild(dimL);

Shell.label(s2, (x1 + PIVOT_X) / 2, 235, '$d_1 = 2$ m', {role: 'given', anchor: [(x1 + PIVOT_X) / 2, 245], until: 'end'});

// ขั้นที่ 3: กำหนดตำแหน่งมวล 30 kg ทางขวา
var s3 = Shell.step('สมมุติวางมวล $m_2 = 30$ kg ($W_2 = 300$ N) ห่างจากจุดหมุนไปทางขวาเป็นระยะ $x$');

var x2 = PIVOT_X + (8 / 3) * PX_PER_M; // 773.33 px
var box2 = document.createElementNS(SVGNS, 'rect');
box2.setAttribute('x', x2 - 18);
box2.setAttribute('y', BEAM_Y - 26);
box2.setAttribute('width', '36');
box2.setAttribute('height', '26');
box2.setAttribute('rx', '3');
box2.setAttribute('fill', '#fde047');
box2.setAttribute('stroke', C.work);
box2.setAttribute('stroke-width', '2');
s3.appendChild(box2);

Shell.label(s3, x2, BEAM_Y - 36, '$30$ kg', {role: 'work', anchor: [x2, BEAM_Y - 26], until: 'end'});

// ลูกศรน้ำหนักมวล 2
Shell.arrow(s3, x2, BEAM_Y + BEAM_H, x2, BEAM_Y + BEAM_H + 300 * PX_PER_N, {
  role: 'work',
  label: '$W_2 = 300$ N',
  value: 300,
  unit: 'N',
  until: 'end'
});

// เส้นบอกระยะ x ทางขวา
var dimR = document.createElementNS(SVGNS, 'line');
dimR.setAttribute('x1', PIVOT_X);
dimR.setAttribute('y1', '245');
dimR.setAttribute('x2', x2);
dimR.setAttribute('y2', '245');
dimR.setAttribute('stroke', C.work);
dimR.setAttribute('stroke-width', '1.5');
s3.appendChild(dimR);

Shell.label(s3, (PIVOT_X + x2) / 2, 235, 'ระยะ $x$', {role: 'work', anchor: [(PIVOT_X + x2) / 2, 245], until: 'end'});

// ==========================================
// กลุ่มที่ 3: ใช้เงื่อนไขสมดุลต่อการหมุน
// ==========================================
Shell.group('ใช้เงื่อนไขสมดุลต่อการหมุน');

var s4 = Shell.step('คำนวณโมเมนต์ทวนเข็มนาฬิกา รอบจุดหมุน: $M = W_1 \\times d_1 = 400 \\times 2 = 800$ N·m', {
  uses: [2]
});

Shell.label(s4, x1 - 10, 430, 'โมเมนต์ทวนเข็ม $= 800$ N·m', {role: 'work', anchor: [x1, 390], until: 'step'});

var s5 = Shell.step('คำนวณโมเมนต์ตามเข็มนาฬิกา รอบจุดหมุน: $M = W_2 \\times x = 300x$ N·m', {
  uses: [3]
});

Shell.label(s5, x2 + 10, 400, 'โมเมนต์ตามเข็ม $= 300x$ N·m', {role: 'work', anchor: [x2, 360], until: 'step'});

var s6 = Shell.step('จากสมดุลการหมุน $\\sum M = 0$ จะได้ โมเมนต์ทวนเข็ม $=$ โมเมนต์ตามเข็ม<br>$800 = 300x \\implies x = \\frac{800}{300} = \\frac{8}{3} \\approx 2.67$ m', {
  uses: [4, 5],
  why: 'เมื่อคานอยู่ในสภาพสมดุล ผลรวมโมเมนต์รอบจุดหมุนใด ๆ ต้องมีค่าเท่ากับศูนย์'
});

Shell.label(s6, (PIVOT_X + x2) / 2, 210, '$x = 2.67$ m', {role: 'answer', anchor: [(PIVOT_X + x2) / 2, 245], until: 'end'});

Shell.answer('ระยะทางที่ต้องวางมวล $30$ kg ไปทางขวาของจุดหมุน', '$x = 2.67$ m', {
  sanity: 'สมเหตุสมผล เพราะมวล $30$ kg เบากว่ามวล $40$ kg จึงต้องวางไกลจากจุดหมุนมากกว่า $2$ m และระยะ $2.67$ m ยังไม่เกินขอบคานด้านขวา ($3$ m)'
});

Shell.done();
</script>
</body></html>
