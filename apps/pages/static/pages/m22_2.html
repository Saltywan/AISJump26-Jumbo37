<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>ปริมาตรและพื้นที่ผิวของรูปทรงประกอบ</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

function createEl(tag, attrs) {
  var el = document.createElementNS(SVGNS, tag);
  for (var k in attrs) {
    el.setAttribute(k, attrs[k]);
  }
  return el;
}

Shell.page({
  title: 'ปริมาตรและพื้นที่ผิวของรูปทรงประกอบ',
  problem: 'กรวยตันวางซ้อนบนทรงกระบอกที่มีรัศมีฐานเท่ากัน โดยทรงกระบอกสูง $8$ ซม. รัศมี $3$ ซม. และกรวยสูง $4$ ซม. จงหาปริมาตรรวมของรูปทรงทั้งหมด และพื้นที่ผิวภายนอกทั้งหมด (ไม่รวมส่วนที่กรวยกับทรงกระบอกสัมผัสกัน)'
});

var g = Shell.canvas();
var C = Shell.C;

Shell.setup('แยกการคำนวณออกเป็น <b>ปริมาตรรวม</b> (นำปริมาตรของทั้งสองรูปทรงมารวมกันโดยตรง) และ <b>พื้นที่ผิวภายนอก</b> (คิดเฉพาะผิวรอบนอกที่สัมผัสอากาศ โดยไม่รวมฐานรอยต่อระหว่างกรวยกับทรงกระบอก)');

var PX_PER_CM = 30;
var cx = 300;
var rx = 3 * PX_PER_CM; // 90 px
var ry = 24;            // semi-minor axis for 3D perspective

var yApex = 75;
var yMid = yApex + 4 * PX_PER_CM; // 195 px
var yBot = yMid + 8 * PX_PER_CM;  // 435 px

// ==========================================
// กลุ่มที่ 1: กำหนดมิติและหาสูงเอียงของกรวย
// ==========================================
Shell.group('วิเคราะห์ขนาดและหาสูงเอียงของกรวย');

var s1 = Shell.step('ทรงกระบอกมีรัศมี $r = 3$ ซม. สูง $h_1 = 8$ ซม. และกรวยสูง $h_2 = 4$ ซม.');

// เส้นโยงสำหรับบอกขนาด (Dimension projection lines)
s1.appendChild(createEl('line', {
  x1: cx, y1: yApex, x2: 125, y2: yApex,
  stroke: C.note, 'stroke-dasharray': '4,4', opacity: '0.45'
}));
s1.appendChild(createEl('line', {
  x1: cx - rx, y1: yMid, x2: 125, y2: yMid,
  stroke: C.note, 'stroke-dasharray': '4,4', opacity: '0.45'
}));
s1.appendChild(createEl('line', {
  x1: cx - rx, y1: yBot, x2: 125, y2: yBot,
  stroke: C.note, 'stroke-dasharray': '4,4', opacity: '0.45'
}));

// แกนสมมาตรแนวดิ่ง
s1.appendChild(createEl('line', {
  x1: cx, y1: 58, x2: cx, y2: yBot + 18,
  stroke: C.note, 'stroke-dasharray': '7,4,2,4', opacity: '0.5'
}));

// วาดเนื้อทรงกระบอก (เงาพื้นหลัง)
s1.appendChild(createEl('path', {
  d: 'M ' + (cx - rx) + ',' + yMid + ' L ' + (cx - rx) + ',' + yBot +
     ' A ' + rx + ',' + ry + ' 0 0,0 ' + (cx + rx) + ',' + yBot +
     ' L ' + (cx + rx) + ',' + yMid + ' A ' + rx + ',' + ry + ' 0 0,1 ' + (cx - rx) + ',' + yMid + ' Z',
  fill: C.note, 'fill-opacity': '0.07'
}));

// วาดเนื้อกรวย (เงาพื้นหลัง)
s1.appendChild(createEl('path', {
  d: 'M ' + cx + ',' + yApex + ' L ' + (cx + rx) + ',' + yMid +
     ' A ' + rx + ',' + ry + ' 0 0,1 ' + (cx - rx) + ',' + yMid + ' Z',
  fill: C.note, 'fill-opacity': '0.07'
}));

// โครงเส้นทรงกระบอก
s1.appendChild(createEl('line', {
  x1: cx - rx, y1: yMid, x2: cx - rx, y2: yBot,
  stroke: C.note, 'stroke-width': '2'
}));
s1.appendChild(createEl('line', {
  x1: cx + rx, y1: yMid, x2: cx + rx, y2: yBot,
  stroke: C.note, 'stroke-width': '2'
}));
s1.appendChild(createEl('path', {
  d: 'M ' + (cx - rx) + ',' + yBot + ' A ' + rx + ',' + ry + ' 0 0,0 ' + (cx + rx) + ',' + yBot,
  stroke: C.note, 'stroke-width': '2', fill: 'none'
}));
s1.appendChild(createEl('path', {
  d: 'M ' + (cx + rx) + ',' + yBot + ' A ' + rx + ',' + ry + ' 0 0,0 ' + (cx - rx) + ',' + yBot,
  stroke: C.note, 'stroke-width': '1.5', 'stroke-dasharray': '5,4', fill: 'none'
}));

// รอยต่อระหว่างกรวยกับทรงกระบอก (เส้นประบอกว่าเป็นรอยต่อด้านใน)
s1.appendChild(createEl('ellipse', {
  cx: cx, cy: yMid, rx: rx, ry: ry,
  stroke: C.note, 'stroke-width': '1.5', 'stroke-dasharray': '5,4', fill: 'none'
}));

// โครงเส้นกรวย
s1.appendChild(createEl('line', {
  x1: cx, y1: yApex, x2: cx - rx, y2: yMid,
  stroke: C.note, 'stroke-width': '2'
}));
s1.appendChild(createEl('line', {
  x1: cx, y1: yApex, x2: cx + rx, y2: yMid,
  stroke: C.note, 'stroke-width': '2'
}));

// จุดศูนย์กลางที่รอยต่อ
s1.appendChild(createEl('circle', {
  cx: cx, cy: yMid, r: '3.5', fill: C.note
}));

// ลูกศรบอกขนาดตามที่โจทย์กำหนด (ใช้ Shell.arrow ทุกเส้น ความยาวตรงกับมาตราส่วน)
Shell.arrow(s1, 140, yBot, 140, yMid, {
  role: 'given', label: '$h_1 = 8$ ซม.', value: 8, unit: 'ซม.', until: 'end'
});
Shell.arrow(s1, 140, yMid, 140, yApex, {
  role: 'given', label: '$h_2 = 4$ ซม.', value: 4, unit: 'ซม.', until: 'end'
});
Shell.arrow(s1, cx, yMid, cx + rx, yMid, {
  role: 'given', label: '$r = 3$ ซม.', value: 3, unit: 'ซม.', until: 'end'
});

Shell.label(s1, cx, 48, 'กรวยตัน', {role: 'note', anchor: [cx, yApex], until: 'end'});
Shell.label(s1, 420, 315, 'ทรงกระบอกตัน', {role: 'note', anchor: [cx + rx, 315], until: 'end'});

// ขั้นที่ 2: หาสูงเอียง
var s2 = Shell.step('หาสูงเอียง $\\ell$ ของกรวย จากทฤษฎีบทพีทาโกรัส $\\ell = \\sqrt{r^2 + h_2^2} = \\sqrt{3^2 + 4^2} = 5$ ซม.', {
  why: 'พื้นที่ผิวข้างของกรวยต้องใช้ความยาวสูงเอียงตามแนวลาด ไม่ใช่ความสูงตรงในแนวดิ่ง',
  uses: [1]
});

// สามเหลี่ยมมุมฉากภายในกรวย
s2.appendChild(createEl('polygon', {
  points: cx + ',' + yApex + ' ' + cx + ',' + yMid + ' ' + (cx + rx) + ',' + yMid,
  fill: C.work, 'fill-opacity': '0.22', stroke: C.work, 'stroke-width': '1.5', 'stroke-dasharray': '3,3'
}));

// สัญลักษณ์มุมฉาก
s2.appendChild(createEl('path', {
  d: 'M ' + cx + ',' + (yMid - 14) + ' L ' + (cx + 14) + ',' + (yMid - 14) + ' L ' + (cx + 14) + ',' + yMid,
  stroke: C.work, 'stroke-width': '1.5', fill: 'none'
}));

// ลูกศรบอกสูงเอียง (ยาว 150 px = 5 * PX_PER_CM)
Shell.arrow(s2, cx, yApex, cx + rx, yMid, {
  role: 'work', label: '$\\ell = 5$ ซม.', value: 5, unit: 'ซม.', until: 'end'
});

Shell.label(s2, cx + 45, yMid - 60, '$\\ell = 5$ ซม.', {
  role: 'work', anchor: [cx + 45, (yApex + yMid) / 2], until: 'step'
});

// ==========================================
// กลุ่มที่ 2: คำนวณปริมาตรรวม
// ==========================================
Shell.group('คำนวณปริมาตรรวม');

var s3 = Shell.step('คำนวณปริมาตรทรงกระบอก จากสูตร $V_1 = \\pi r^2 h_1 = \\pi (3)^2 (8) = 72\\pi$ ลบ.ซม.', {
  uses: [1]
});

s3.appendChild(createEl('path', {
  d: 'M ' + (cx - rx) + ',' + yMid + ' L ' + (cx - rx) + ',' + yBot +
     ' A ' + rx + ',' + ry + ' 0 0,0 ' + (cx + rx) + ',' + yBot +
     ' L ' + (cx + rx) + ',' + yMid + ' A ' + rx + ',' + ry + ' 0 0,1 ' + (cx - rx) + ',' + yMid + ' Z',
  fill: C.work, 'fill-opacity': '0.32'
}));
Shell.label(s3, cx, 315, '$V_1 = 72\\pi$ ลบ.ซม.', {
  role: 'work', anchor: [cx, 315], until: 'step'
});

var s4 = Shell.step('คำนวณปริมาตรกรวย จากสูตร $V_2 = \\frac{1}{3}\\pi r^2 h_2 = \\frac{1}{3}\\pi (3)^2 (4) = 12\\pi$ ลบ.ซม.', {
  uses: [1]
});

s4.appendChild(createEl('path', {
  d: 'M ' + cx + ',' + yApex + ' L ' + (cx + rx) + ',' + yMid +
     ' A ' + rx + ',' + ry + ' 0 0,1 ' + (cx - rx) + ',' + yMid + ' Z',
  fill: C.work, 'fill-opacity': '0.35'
}));
Shell.label(s4, cx, 145, '$V_2 = 12\\pi$ ลบ.ซม.', {
  role: 'work', anchor: [cx, 145], until: 'step'
});

var s5 = Shell.step('รวมปริมาตรทั้งหมด $V = V_1 + V_2 = 72\\pi + 12\\pi = 84\\pi$ ลบ.ซม. (ประมาณ $263.89$ ลบ.ซม.)', {
  uses: [3, 4]
});

// ไฮไลต์ปริมาตรรวมทั้งสองชิ้น
s5.appendChild(createEl('path', {
  d: 'M ' + cx + ',' + yApex + ' L ' + (cx + rx) + ',' + yMid + ' L ' + (cx + rx) + ',' + yBot +
     ' A ' + rx + ',' + ry + ' 0 0,0 ' + (cx - rx) + ',' + yBot +
     ' L ' + (cx - rx) + ',' + yMid + ' Z',
  fill: C.answer, 'fill-opacity': '0.18'
}));

Shell.label(s5, 710, 95, 'ปริมาตรรวม $V = 84\\pi$ ลบ.ซม.', {
  role: 'answer', anchor: [cx + rx, 250], until: 'end'
});

// ==========================================
// กลุ่มที่ 3: คำนวณพื้นที่ผิวภายนอก
// ==========================================
Shell.group('คำนวณพื้นที่ผิวภายนอก');

var s6 = Shell.step('คำนวณพื้นที่ผิวข้างกรวย จากสูตร $A_1 = \\pi r \\ell = \\pi (3)(5) = 15\\pi$ ตร.ซม.', {
  uses: [1, 2]
});

// เส้นเน้นผิวข้างกรวย
s6.appendChild(createEl('line', {
  x1: cx, y1: yApex, x2: cx - rx, y2: yMid,
  stroke: C.work, 'stroke-width': '4'
}));
s6.appendChild(createEl('line', {
  x1: cx, y1: yApex, x2: cx + rx, y2: yMid,
  stroke: C.work, 'stroke-width': '4'
}));
Shell.label(s6, 520, 125, 'ผิวข้างกรวย $15\\pi$ ตร.ซม.', {
  role: 'work', anchor: [cx + rx / 2, 135], until: 'step'
});

var s7 = Shell.step('คำนวณพื้นที่ผิวข้างทรงกระบอก จากสูตร $A_2 = 2\\pi r h_1 = 2\\pi (3)(8) = 48\\pi$ ตร.ซม.', {
  uses: [1]
});

// เส้นเน้นผิวข้างทรงกระบอก
s7.appendChild(createEl('line', {
  x1: cx - rx, y1: yMid, x2: cx - rx, y2: yBot,
  stroke: C.work, 'stroke-width': '4'
}));
s7.appendChild(createEl('line', {
  x1: cx + rx, y1: yMid, x2: cx + rx, y2: yBot,
  stroke: C.work, 'stroke-width': '4'
}));
Shell.label(s7, 520, 315, 'ผิวข้างกระบอก $48\\pi$ ตร.ซม.', {
  role: 'work', anchor: [cx + rx, 315], until: 'step'
});

var s8 = Shell.step('คำนวณพื้นที่ฐานล่างของทรงกระบอก $A_3 = \\pi r^2 = \\pi (3)^2 = 9\\pi$ ตร.ซม. โดย<b>ไม่คิด</b>ฐานรอยต่อด้านบน', {
  why: 'รอยต่อระหว่างกรวยกับทรงกระบอกประกบติดกันอยู่ภายใน ไม่สัมผัสอากาศภายนอก จึงไม่นำมาคิดเป็นพื้นที่ผิว',
  uses: [1]
});

// ไฮไลต์ฐานล่าง
s8.appendChild(createEl('ellipse', {
  cx: cx, cy: yBot, rx: rx, ry: ry,
  fill: C.work, 'fill-opacity': '0.3', stroke: C.work, 'stroke-width': '3'
}));

// สัญลักษณ์เตือนที่รอยต่อด้านใน
s8.appendChild(createEl('ellipse', {
  cx: cx, cy: yMid, rx: rx, ry: ry,
  stroke: C.warn, 'stroke-width': '3', 'stroke-dasharray': '6,4', fill: 'none'
}));
s8.appendChild(createEl('line', {
  x1: cx - 10, y1: yMid - 10, x2: cx + 10, y2: yMid + 10,
  stroke: C.warn, 'stroke-width': '3'
}));
s8.appendChild(createEl('line', {
  x1: cx - 10, y1: yMid + 10, x2: cx + 10, y2: yMid - 10,
  stroke: C.warn, 'stroke-width': '3'
}));

Shell.label(s8, cx, 475, 'ฐานล่าง $9\\pi$ ตร.ซม.', {
  role: 'work', anchor: [cx, yBot], until: 'step'
});
Shell.label(s8, 520, 195, 'รอยต่อภายใน (ไม่คิด)', {
  role: 'warn', anchor: [cx + 30, yMid], until: 'step'
});

var s9 = Shell.step('รวมพื้นที่ผิวภายนอกทั้งหมด $A = A_1 + A_2 + A_3 = 15\\pi + 48\\pi + 9\\pi = 72\\pi$ ตร.ซม. (ประมาณ $226.19$ ตร.ซม.)', {
  uses: [6, 7, 8]
});

// ไฮไลต์ผิวภายนอกรอบนอกทั้งหมด
s9.appendChild(createEl('path', {
  d: 'M ' + cx + ',' + yApex + ' L ' + (cx - rx) + ',' + yMid + ' L ' + (cx - rx) + ',' + yBot +
     ' A ' + rx + ',' + ry + ' 0 0,0 ' + (cx + rx) + ',' + yBot +
     ' L ' + (cx + rx) + ',' + yMid + ' Z',
  stroke: C.answer, 'stroke-width': '3.5', fill: 'none'
}));

Shell.label(s9, 710, 155, 'พื้นที่ผิวภายนอก $A = 72\\pi$ ตร.ซม.', {
  role: 'answer', anchor: [cx + rx, 350], until: 'end'
});

// ตารางสรุปผลลัพธ์บนภาพ
Shell.table(s9, 490, 225, [
  ['ส่วนประกอบ', 'ปริมาตร', 'พื้นที่ผิวภายนอก'],
  ['กรวยตัน', '$12\\pi$ ลบ.ซม.', '$15\\pi$ (ผิวข้าง)'],
  ['ทรงกระบอกตัน', '$72\\pi$ ลบ.ซม.', '$48\\pi + 9\\pi = 57\\pi$'],
  ['รวมทั้งหมด', '$84\\pi$ ลบ.ซม.', '$72\\pi$ ตร.ซม.']
], {roles: ['note', 'work', 'answer'], colW: 145, rowH: 38});

// ==========================================
// สรุปคำตอบสุดท้าย
// ==========================================
Shell.answer(
  'ปริมาตรรวมและพื้นที่ผิวภายนอก',
  'ปริมาตรรวม $84\\pi$ ลบ.ซม. (ประมาณ $263.89$ ลบ.ซม.) และพื้นที่ผิวภายนอก $72\\pi$ ตร.ซม. (ประมาณ $226.19$ ตร.ซม.)',
  {sanity: 'ปริมาตรรวม ($84\\pi$ ลบ.ซม.) ต้องมากกว่าทรงกระบอกเดี่ยว ($72\\pi$ ลบ.ซม.) และพื้นที่ผิวภายนอกไม่รวมฐานรอยต่อ $2\\pi r^2 = 18\\pi$ ตร.ซม. จึงน้อยกว่าผลรวมพื้นที่ผิวทั้งหมดเมื่อแยกสองรูปทรงออกจากกัน'}
);

Shell.done();
</script>
</body></html>
