<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>ส่วนประกอบของไฮเพอร์โบลา</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/jsxgraph.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/jsxgraphcore.js"></script>
<script src="./lib/shell.js"></script>
<script>
var b = Shell.board({box: [-8, 6, 8, -6], grid: true, axis: true, keepaspect: true});
var C = Shell.C;

Shell.page({
  title: 'ส่วนประกอบของไฮเพอร์โบลา',
  problem: 'ไฮเพอร์โบลามีสมการ $\\frac{x^2}{16} - \\frac{y^2}{9} = 1$ จงหาจุดยอด โฟกัสทั้งสอง และสมการเส้นกำกับทั้งสองเส้น พร้อมวาดรูปแสดงส่วนประกอบเหล่านั้น',
  level: 'ม.4'
});

Shell.setup('สมการอยู่ในรูปมาตรฐาน $\\frac{x^2}{a^2} - \\frac{y^2}{b^2} = 1$ โดย $a^2=16, b^2=9$ เป็นไฮเพอร์โบลาแนวนอนที่มีจุดศูนย์กลางอยู่ที่ $(0,0)$');

Shell.group('หาจุดศูนย์กลางและจุดยอด');
var C0 = b.create('point', [0, 0], {strokeColor: C.work, fillColor: C.work, size: 3, fixed: true});
var V1 = b.create('point', [-4, 0], {strokeColor: C.answer, fillColor: C.answer, size: 4, fixed: true});
var V2 = b.create('point', [4, 0], {strokeColor: C.answer, fillColor: C.answer, size: 4, fixed: true});

var s1 = Shell.step('จาก $a^2 = 16$ จะได้ $a = 4$ จุดยอดทั้งสองคือ $V_1(-4, 0)$ และ $V_2(4, 0)$', {
  why: 'พจน์ $x^2$ เป็นบวก แกนตามขวางจึงวางตามแนวแกน $X$ และจุดยอดอยู่ห่างจากจุดศูนย์กลางไปทางซ้ายและขวาเป็นระยะ $a = 4$'
});
Shell.on(s1, C0, V1, V2);
Shell.tag(s1, C0, 'C(0, 0)', {role: 'work'});
Shell.tag(s1, V1, 'V_1(-4, 0)', {role: 'answer'});
Shell.tag(s1, V2, 'V_2(4, 0)', {role: 'answer'});

Shell.group('หาจุดโฟกัส');
var F1 = b.create('point', [-5, 0], {strokeColor: C.answer, fillColor: C.answer, size: 4, fixed: true});
var F2 = b.create('point', [5, 0], {strokeColor: C.answer, fillColor: C.answer, size: 4, fixed: true});

var s2 = Shell.step('จาก $c^2 = a^2 + b^2 = 16 + 9 = 25$ จะได้ $c = 5$ โฟกัสคือ $F_1(-5, 0)$ และ $F_2(5, 0)$', {
  why: 'ไฮเพอร์โบลาต้องมีระยะโฟกัส $c$ ยาวกว่าระยะจุดยอด $a$ เสมอ โดยเป็นไปตามความสัมพันธ์ $c^2 = a^2 + b^2$',
  uses: [1]
});
Shell.on(s2, F1, F2);
Shell.tag(s2, F1, 'F_1(-5, 0)', {role: 'answer'});
Shell.tag(s2, F2, 'F_2(5, 0)', {role: 'answer'});

Shell.group('สร้างกล่องช่วยและเส้นกำกับ');
var p1 = b.create('point', [-4, -3], {visible: false, fixed: true});
var p2 = b.create('point', [-4, 3], {visible: false, fixed: true});
var p3 = b.create('point', [4, 3], {visible: false, fixed: true});
var p4 = b.create('point', [4, -3], {visible: false, fixed: true});
var boxPoly = b.create('polygon', [p1, p2, p3, p4], {
  borders: {strokeColor: C.note, dash: 2, strokeWidth: 1.5},
  fillColor: 'none',
  highlight: false
});

var s3 = Shell.step('จาก $b^2 = 9$ จะได้ $b = 3$ สร้างกล่องสี่เหลี่ยมผืนผ้าช่วยสร้างที่มีจุดยอดมุมที่ $(\\pm 4, \\pm 3)$', {
  why: 'กล่องช่วยสร้างขนาด $2a \\times 2b$ ช่วยกำหนดความชันและตำแหน่งของเส้นกำกับ',
  uses: [1]
});
Shell.on(s3, boxPoly);

var asym1 = b.create('line', [p1, p3], {strokeColor: C.work, dash: 3, strokeWidth: 1.5, fixed: true});
var asym2 = b.create('line', [p2, p4], {strokeColor: C.work, dash: 3, strokeWidth: 1.5, fixed: true});

var s4 = Shell.step('ลากเส้นกำกับผ่านเส้นทแยงมุมของกล่อง ได้สมการ $y = \\pm \\frac{3}{4}x$', {
  why: 'เส้นกำกับของไฮเพอร์โบลาแนวนอนที่มีจุดศูนย์กลางที่ $(0,0)$ มีสมการคือ $y = \\pm \\frac{b}{a}x$',
  uses: [3]
});
Shell.on(s4, asym1, asym2);

Shell.group('วาดกราฟไฮเพอร์โบลา');
var hyp = b.create('hyperbola', [F1, F2, V2], {strokeColor: C.answer, strokeWidth: 2.5});

var s5 = Shell.step('วาดกิ่งไฮเพอร์โบลาทั้งสองข้างผ่านจุดยอด $V_1, V_2$ และลู่เข้าสู่เส้นกำกับ', {
  uses: [1, 2, 4]
});
Shell.on(s5, hyp);

Shell.answer('จุดยอด', '$V_1(-4, 0), V_2(4, 0)$');
Shell.answer('จุดโฟกัส', '$F_1(-5, 0), F_2(5, 0)$');
Shell.answer('สมการเส้นกำกับ', '$y = \\frac{3}{4}x$ และ $y = -\\frac{3}{4}x$', {
  sanity: 'ระยะโฟกัส $c = 5 > a = 4$ และเส้นกำกับตัดกันที่จุดศูนย์กลาง $(0, 0)$ พอดี'
});
Shell.done();
</script>
</body></html>
