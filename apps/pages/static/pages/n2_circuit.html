<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>การวิเคราะห์วงจรไฟฟ้าตัวต้านทานแบบผสม</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

Shell.page({
  title: 'วงจรไฟฟ้าตัวต้านทานแบบผสม',
  problem: 'ตัวต้านทาน $R_1 = 6\\ \\Omega$ ต่อขนานกับ $R_2 = 3\\ \\Omega$ แล้วนำไปต่ออนุกรมกับ $R_3 = 4\\ \\Omega$ ต่อเข้ากับแบตเตอรี่ $12$ V จงหาความต้านทานรวม กระแสรวมในวงจร และกระแสที่ไหลผ่าน $R_1$',
  level: 'ม.5'
});

var g = Shell.canvas();
var C = Shell.C;
var PX_PER_A = 45;

Shell.setup('ยุบวงจรจากส่วนย่อยที่ต่อขนานกันก่อนเพื่อหาความต้านทานสมมูล จากนั้นรวมแบบอนุกรมกับส่วนที่เหลือ แล้วจึงใช้กฎของโอห์มคำนวณหากระแสรวมและกระแสในแต่ละสาขา');

function createEl(tag, attrs) {
  var el = document.createElementNS(SVGNS, tag);
  for (var k in attrs) {
    el.setAttribute(k, attrs[k]);
  }
  return el;
}

function drawWire(parent, d, color, width, dash) {
  var path = createEl('path', {
    d: d,
    fill: 'none',
    stroke: color || C.note,
    'stroke-width': width || 3,
    'stroke-linejoin': 'round',
    'stroke-linecap': 'round',
    'stroke-dasharray': dash || 'none'
  });
  parent.appendChild(path);
  return path;
}

function drawResistor(parent, x, y, w, h, strokeColor, fillColor) {
  var group = createEl('g', {});
  var rect = createEl('rect', {
    x: x,
    y: y,
    width: w,
    height: h,
    rx: 4,
    ry: 4,
    fill: fillColor || '#1e293b',
    stroke: strokeColor || C.given,
    'stroke-width': 2.5
  });
  group.appendChild(rect);
  parent.appendChild(group);
  return group;
}

function drawBattery(parent, cx, cy, strokeColor) {
  var group = createEl('g', {});
  var longLine = createEl('line', {
    x1: cx - 24, y1: cy - 12,
    x2: cx + 24, y2: cy - 12,
    stroke: strokeColor || C.given,
    'stroke-width': 3.5,
    'stroke-linecap': 'round'
  });
  var shortLine = createEl('line', {
    x1: cx - 14, y1: cy + 12,
    x2: cx + 14, y2: cy + 12,
    stroke: strokeColor || C.given,
    'stroke-width': 5,
    'stroke-linecap': 'round'
  });
  group.appendChild(longLine);
  group.appendChild(shortLine);
  parent.appendChild(group);
  return group;
}

// -------------------------------------------------------------
// กลุ่มที่ 1: การหาความต้านทานรวม
// -------------------------------------------------------------
Shell.group('ยุบวงจรเพื่อหาความต้านทานรวม');

var s1 = Shell.step('พิจารณาวงจรไฟฟ้าเริ่มต้น: $R_1 = 6\\ \\Omega$ ต่อขนานกับ $R_2 = 3\\ \\Omega$ และต่ออนุกรมกับ $R_3 = 4\\ \\Omega$ เข้ากับแบตเตอรี่ $12$ V');

// วาดโครงวงจรเริ่มต้น
drawWire(s1, 'M 160 270 L 160 190 L 360 190');
drawWire(s1, 'M 360 190 L 360 130 L 440 130');
drawWire(s1, 'M 540 130 L 610 130 L 610 190');
drawWire(s1, 'M 360 190 L 360 250 L 440 250');
drawWire(s1, 'M 540 250 L 610 250 L 610 190');
drawWire(s1, 'M 610 190 L 670 190');
drawWire(s1, 'M 770 190 L 830 190 L 830 410 L 160 410 L 160 310');

// วาดสัญลักษณ์อุปกรณ์
drawBattery(s1, 160, 290, C.given);
drawResistor(s1, 440, 115, 100, 30, C.given);
drawResistor(s1, 440, 235, 100, 30, C.given);
drawResistor(s1, 670, 175, 100, 30, C.given);

// ป้ายกำกับอุปกรณ์
Shell.label(s1, 110, 290, '$V = 12$ V', {role:'given', anchor:[160, 290], until:'end'});
Shell.label(s1, 490, 95, '$R_1 = 6\\ \\Omega$', {role:'given', anchor:[490, 115], until:'end'});
Shell.label(s1, 490, 280, '$R_2 = 3\\ \\Omega$', {role:'given', anchor:[490, 265], until:'end'});
Shell.label(s1, 720, 155, '$R_3 = 4\\ \\Omega$', {role:'given', anchor:[720, 175], until:'end'});

// ขั้นที่ 2: รวมความต้านทานแบบขนาน R1 และ R2
var s2 = Shell.step('ยุบส่วนขนาน $R_1$ และ $R_2$ จะได้ $\\frac{1}{R_{12}} = \\frac{1}{6} + \\frac{1}{3} = \\frac{3}{6} \\Rightarrow R_{12} = 2\\ \\Omega$', {
  why: 'ตัวต้านทาน $R_1$ และ $R_2$ ต่อคร่อมจุดร่วมคู่เดียวกัน จึงมีความต่างศักย์เท่ากันและเป็นการต่อแบบขนาน'
});

// กรอบเน้นส่วนขนาน
var boxParallel = createEl('rect', {
  x: 340, y: 80, width: 290, height: 215, rx: 8, ry: 8,
  fill: 'none', stroke: C.work, 'stroke-width': 2, 'stroke-dasharray': '6,6'
});
s2.appendChild(boxParallel);
Shell.label(s2, 490, 60, '$R_{12} = 2\\ \\Omega$', {role:'work', anchor:[490, 80], until:'step'});

// ขั้นที่ 3: รวมแบบอนุกรมกับ R3
var s3 = Shell.step('หาความต้านทานรวมทั้งวงจร โดยนำ $R_{12}$ มารวมแบบอนุกรมกับ $R_3$: $R_{\\text{total}} = R_{12} + R_3 = 2 + 4 = 6\\ \\Omega$', {
  why: 'กระแสไฟฟ้าทั้งหมดที่ผ่านชุดขนาน $R_{12}$ จะต้องไหลผ่าน $R_3$ ต่อไป จึงเป็นการต่อแบบอนุกรม',
  uses: [2]
});

// กรอบเน้นความต้านทานรวม
var boxTotal = createEl('rect', {
  x: 330, y: 70, width: 515, height: 235, rx: 10, ry: 10,
  fill: 'none', stroke: C.answer, 'stroke-width': 2.5, 'stroke-dasharray': '8,4'
});
s3.appendChild(boxTotal);
Shell.label(s3, 580, 45, '$R_{\\text{total}} = 6\\ \\Omega$', {role:'answer', anchor:[580, 70], until:'end'});

// -------------------------------------------------------------
// กลุ่มที่ 2: การหากระแสไฟฟ้าในวงจร
// -------------------------------------------------------------
Shell.group('คำนวณกระแสไฟฟ้าในวงจร');

// ขั้นที่ 4: หากระแสไฟฟ้ารวม
var s4 = Shell.step('หากระแสไฟฟ้ารวมในวงจรจากกฎของโอห์ม: $I_{\\text{total}} = \\frac{V}{R_{\\text{total}}} = \\frac{12}{6} = 2$ A', {
  why: 'ใช้กฎของโอห์ม $I = \\frac{V}{R}$ กับวงจรทั้งระบบ โดยใช้แรงดันไฟฟ้ารวมและความต้านทานรวม',
  uses: [3]
});

// ลูกศรกระแสไฟฟ้ารวม (ความยาว = 2 A * 45 px/A = 90 px)
Shell.arrow(s4, 230, 190, 230 + 2 * PX_PER_A, 190, {
  role: 'answer',
  label: '$I_{\\text{total}} = 2$ A',
  value: 2,
  unit: 'A',
  until: 'end'
});

// ขั้นที่ 5: หาความต่างศักย์ตกคร่อมส่วนขนาน
var s5 = Shell.step('หาความต่างศักย์ตกคร่อมชุดขนาน $R_{12}$: $V_{12} = I_{\\text{total}} \\times R_{12} = 2 \\times 2 = 4$ V', {
  why: 'กระแสรวม $I_{\\text{total}}$ ไหลผ่านความต้านทานสมมูลของชุดขนาน $R_{12}$ ทำให้เกิดความต่างศักย์ตกคร่อม',
  uses: [2, 4]
});

drawWire(s5, 'M 360 85 L 610 85', C.work, 2, '4,4');
Shell.label(s5, 485, 70, '$V_{12} = 4$ V', {role:'work', anchor:[485, 85], until:'step'});

// ขั้นที่ 6: หากระแสที่ไหลผ่าน R1
var s6 = Shell.step('หากระแสไฟฟ้าที่ไหลผ่าน $R_1$: $I_1 = \\frac{V_{12}}{R_1} = \\frac{4}{6} = \\frac{2}{3}$ A (ประมาณ $0.67$ A)', {
  why: 'ความต่างศักย์ตกคร่อมตัวต้านทานแต่ละตัวในวงจรขนานมีค่าเท่ากับความต่างศักย์ของชุดขนานนั้น',
  uses: [5]
});

// ลูกศรกระแสผ่าน R1 (ความยาว = 0.67 A * 45 px/A ≈ 30 px)
Shell.arrow(s6, 375, 130, 375 + (2/3) * PX_PER_A, 130, {
  role: 'answer',
  label: '$I_1 = \\frac{2}{3}$ A',
  value: 2/3,
  unit: 'A',
  until: 'end'
});

// -------------------------------------------------------------
// กล่องคำตอบสุดท้าย
// -------------------------------------------------------------
Shell.answer(
  'ความต้านทานรวมของวงจร',
  '$R_{\\text{total}} = 6\\ \\Omega$',
  {sanity: 'มากกว่า $R_3 = 4\\ \\Omega$ เพราะมีส่วนขนาน $R_{12} = 2\\ \\Omega$ ต่ออนุกรมเพิ่มเข้ามา'}
);

Shell.answer(
  'กระแสไฟฟ้ารวมในวงจร',
  '$I_{\\text{total}} = 2$ A',
  {sanity: 'เมื่อแหล่งกำเนิด $12$ V จ่ายให้ความต้านทานรวม $6\\ \\Omega$ จะได้กระแส $2$ A ตามกฎของโอห์ม'}
);

Shell.answer(
  'กระแสไฟฟ้าที่ไหลผ่าน $R_1$',
  '$I_1 = \\frac{2}{3}$ A ($0.67$ A)',
  {sanity: 'กระแสรวม $2$ A จะแยกไหลผ่าน $R_1$ เป็น $\\frac{2}{3}$ A และ $R_2$ เป็น $\\frac{4}{3}$ A โดยผ่าน $R_1$ น้อยกว่าเพราะมีความต้านทานมากกว่า'}
);

Shell.done();
</script>
</body></html>
