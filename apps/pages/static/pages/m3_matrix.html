<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>ดีเทอร์มิแนนต์และเมทริกซ์ผกผันขนาด 2x2</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

Shell.page({
  title: 'การหาดีเทอร์มิแนนต์และเมทริกซ์ผกผันขนาด 2x2',
  problem: 'กำหนดเมทริกซ์ $A = \\begin{bmatrix} 2 & 1 \\\\ 3 & 4 \\end{bmatrix}$ จงหาดีเทอร์มิแนนต์ของ A และเมทริกซ์ผกผัน $A^{-1}$',
  level: 'ม.5'
});

var g = Shell.canvas();
var C = Shell.C;

Shell.setup('สำหรับเมทริกซ์ขนาด $2 \\times 2$ ดีเทอร์มิแนนต์หาได้จากผลคูณแนวทแยงหลักลบแนวทแยงรอง และเมทริกซ์ผกผันหาได้จาก $A^{-1} = \\frac{1}{\\det(A)}\\operatorname{adj}(A)$ เมื่อ $\\det(A) \\neq 0$');

Shell.group('คำนวณดีเทอร์มิแนนต์ $\\det(A)$');

var s1 = Shell.step('พิจารณาเมทริกซ์ $A$ ในรูปแบบ $\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix} = \\begin{bmatrix} 2 & 1 \\\\ 3 & 4 \\end{bmatrix}$');

var lb1 = document.createElementNS(SVGNS, 'path');
lb1.setAttribute('d', 'M 160 170 H 140 V 370 H 160');
lb1.setAttribute('stroke', C.given);
lb1.setAttribute('stroke-width', '3.5');
lb1.setAttribute('fill', 'none');
s1.appendChild(lb1);

var rb1 = document.createElementNS(SVGNS, 'path');
rb1.setAttribute('d', 'M 320 170 H 340 V 370 H 320');
rb1.setAttribute('stroke', C.given);
rb1.setAttribute('stroke-width', '3.5');
rb1.setAttribute('fill', 'none');
s1.appendChild(rb1);

Shell.label(s1, 240, 130, 'เมทริกซ์ $A$', {role: 'given', anchor: [240, 130], until: 'end'});
Shell.label(s1, 190, 220, '$a = 2$', {role: 'given', anchor: [190, 220], until: 'end'});
Shell.label(s1, 290, 220, '$b = 1$', {role: 'given', anchor: [290, 220], until: 'end'});
Shell.label(s1, 190, 320, '$c = 3$', {role: 'given', anchor: [190, 320], until: 'end'});
Shell.label(s1, 290, 320, '$d = 4$', {role: 'given', anchor: [290, 320], until: 'end'});

var s2 = Shell.step('คูณสมาชิกตามแนวทแยงลง (เส้นทแยงมุมหลัก): $(2)(4) = 8$', {
  why: 'ตามสูตรดีเทอร์มิแนนต์ สมาชิกบนเส้นทแยงมุมหลักจะมีเครื่องหมายเป็นบวก $(+ad)$'
});

var dLine1 = document.createElementNS(SVGNS, 'line');
dLine1.setAttribute('x1', '175');
dLine1.setAttribute('y1', '205');
dLine1.setAttribute('x2', '305');
dLine1.setAttribute('y2', '335');
dLine1.setAttribute('stroke', C.work);
dLine1.setAttribute('stroke-width', '3');
dLine1.setAttribute('stroke-dasharray', '6,4');
s2.appendChild(dLine1);

Shell.label(s2, 240, 415, 'ทแยงลง: $(2)(4) = +8$', {role: 'work', anchor: [240, 270], until: 'step'});

var s3 = Shell.step('คูณสมาชิกตามแนวทแยงขึ้น (เส้นทแยงมุมรอง): $(1)(3) = 3$', {
  why: 'สมาชิกบนเส้นทแยงมุมรองจะถูกนำมาลบออกจากผลคูณแนวทแยงหลัก $(-bc)$'
});

var dLine2 = document.createElementNS(SVGNS, 'line');
dLine2.setAttribute('x1', '305');
dLine2.setAttribute('y1', '205');
dLine2.setAttribute('x2', '175');
dLine2.setAttribute('y2', '335');
dLine2.setAttribute('stroke', C.warn);
dLine2.setAttribute('stroke-width', '3');
dLine2.setAttribute('stroke-dasharray', '6,4');
s3.appendChild(dLine2);

Shell.label(s3, 240, 415, 'ทแยงขึ้น: $(1)(3) = 3$ (นำไปลบ)', {role: 'warn', anchor: [240, 270], until: 'step'});

var s4 = Shell.step('คำนวณดีเทอร์มิแนนต์ $\\det(A) = ad - bc = 8 - 3 = 5$', {
  uses: [2, 3]
});

Shell.label(s4, 240, 420, '$\\det(A) = 8 - 3 = 5$', {role: 'answer', anchor: [240, 420], until: 'end'});

Shell.group('สร้างเมทริกซ์ผูกพัน $\\operatorname{adj}(A)$');

var s5 = Shell.step('สลับตำแหน่งสมาชิกบนเส้นทแยงมุมหลัก: สลับ $a=2$ กับ $d=4$', {
  why: 'เมทริกซ์ผูกพันขนาด 2x2 เกิดจากการสลับตำแหน่งสมาชิกบนแนวทแยงมุมหลัก'
});

var lb2 = document.createElementNS(SVGNS, 'path');
lb2.setAttribute('d', 'M 600 170 H 580 V 370 H 600');
lb2.setAttribute('stroke', C.work);
lb2.setAttribute('stroke-width', '3.5');
lb2.setAttribute('fill', 'none');
s5.appendChild(lb2);

var rb2 = document.createElementNS(SVGNS, 'path');
rb2.setAttribute('d', 'M 760 170 H 780 V 370 H 760');
rb2.setAttribute('stroke', C.work);
rb2.setAttribute('stroke-width', '3.5');
rb2.setAttribute('fill', 'none');
s5.appendChild(rb2);

Shell.label(s5, 680, 130, 'เมทริกซ์ผูกพัน $\\operatorname{adj}(A)$', {role: 'work', anchor: [680, 130], until: 'end'});
Shell.label(s5, 630, 220, '$4$', {role: 'work', anchor: [630, 220], until: 'end'});
Shell.label(s5, 730, 320, '$2$', {role: 'work', anchor: [730, 320], until: 'end'});

var s6 = Shell.step('เปลี่ยนเครื่องหมายของสมาชิกบนแนวทแยงรอง: $b=1 \\to -1$ และ $c=3 \\to -3$', {
  why: 'เมทริกซ์ผูกพันขนาด 2x2 จะคูณ $-1$ ให้กับสมาชิกในแนวทแยงรองทั้งสองตำแหน่ง'
});

Shell.label(s6, 730, 220, '$-1$', {role: 'work', anchor: [730, 220], until: 'end'});
Shell.label(s6, 630, 320, '$-3$', {role: 'work', anchor: [630, 320], until: 'end'});

Shell.group('คำนวณเมทริกซ์ผกผัน $A^{-1}$');

var s7 = Shell.step('นำค่าสเกลาร์ $\\frac{1}{\\det(A)} = \\frac{1}{5}$ คูณเข้ากับสมาชิกทุกตัวใน $\\operatorname{adj}(A)$', {
  uses: [4, 6],
  why: 'เมทริกซ์ผกผันหาได้จากสูตร $A^{-1} = \\frac{1}{\\det(A)}\\operatorname{adj}(A)$ เมื่อ $\\det(A) \\neq 0$'
});

Shell.label(s7, 530, 270, '$\\times \\frac{1}{5}$', {role: 'work', anchor: [530, 270], until: 'step'});
Shell.label(s7, 680, 420, '$A^{-1} = \\frac{1}{5}\\begin{bmatrix} 4 & -1 \\\\ -3 & 2 \\end{bmatrix}$', {role: 'answer', anchor: [680, 420], until: 'end'});

Shell.answer('ดีเทอร์มิแนนต์ของ A', '$\\det(A) = 5$', {
  sanity: '$\\det(A) = 5 \\neq 0$ แสดงว่าเมทริกซ์ A ไม่ใช่เมทริกซ์เอกฐาน จึงมีเมทริกซ์ผกผัน $A^{-1}$'
});

Shell.answer('เมทริกซ์ผกผัน $A^{-1}$', '$A^{-1} = \\begin{bmatrix} 4/5 & -1/5 \\\\ -3/5 & 2/5 \\end{bmatrix} = \\begin{bmatrix} 0.8 & -0.2 \\\\ -0.6 & 0.4 \\end{bmatrix}$', {
  sanity: 'ตรวจสอบ: $A \\cdot A^{-1} = \\begin{bmatrix} 2 & 1 \\\\ 3 & 4 \\end{bmatrix} \\begin{bmatrix} 0.8 & -0.2 \\\\ -0.6 & 0.4 \\end{bmatrix} = \\begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix} = I$'
});

Shell.done();
</script>
</body></html>
