<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>ควอร์ไทล์ พิสัยระหว่างควอร์ไทล์ และแผนภาพกล่อง</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/jsxgraph.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/jsxgraphcore.js"></script>
<script src="./lib/shell.js"></script>
<script>
var b = Shell.board({box:[32, 5.5, 105, -1], axis:true, keepaspect:false});
var C = Shell.C;

Shell.page({
  title: 'การหาควอร์ไทล์ มัธยฐาน พิสัยระหว่างควอร์ไทล์ และแผนภาพกล่อง',
  problem: 'คะแนนสอบของนักเรียน 11 คน คือ $42, 55, 61, 63, 68, 70, 72, 75, 79, 88, 95$ จงหาค่ามัธยฐาน ควอร์ไทล์ที่หนึ่ง ควอร์ไทล์ที่สาม พิสัยระหว่างควอร์ไทล์ และวาดแผนภาพกล่อง',
  level: 'ม.6'
});

Shell.setup('ข้อมูลชุดนี้เรียงลำดับจากน้อยไปมากเรียบร้อยแล้ว จำนวนข้อมูล $N = 11$ จึงใช้สูตรตำแหน่งควอร์ไทล์ $Q_r = \\frac{r(N+1)}{4}$ สำหรับข้อมูลที่ไม่แจกแจงความถี่');

Shell.group('หาตำแหน่งและค่ามัธยฐาน');
var data = [42, 55, 61, 63, 68, 70, 72, 75, 79, 88, 95];
var pts = [];
for (var i = 0; i < data.length; i++) {
  pts.push(b.create('point', [data[i], 1], {
    strokeColor: C.given,
    fillColor: C.given,
    size: 4,
    name: '',
    withLabel: false
  }));
}

var s1 = Shell.step('พล็อตตำแหน่งข้อมูลทั้ง 11 ค่าบนเส้นจำนวน โดยมีค่าต่ำสุดคือ $42$ และค่าสูงสุดคือ $95$');
Shell.on(s1, pts[0], pts[1], pts[2], pts[3], pts[4], pts[5], pts[6], pts[7], pts[8], pts[9], pts[10]);
Shell.tag(s1, pts[0], 'Min = 42', {role:'given', until:'step'});
Shell.tag(s1, pts[10], 'Max = 95', {role:'given', until:'step'});

var p_med = b.create('point', [70, 1], {
  strokeColor: C.work,
  fillColor: C.work,
  size: 6,
  name: '',
  withLabel: false
});
var s2 = Shell.step('หาค่ามัธยฐาน ($Q_2$ หรือ $\\mathrm{Med}$):<br>ตำแหน่งของ $Q_2 = \\frac{2(11+1)}{4} = 6$<br>ตรงกับข้อมูลตัวที่ 6 คือ <b>$70$</b>', {
  why: 'มัธยฐานคือค่าที่มีตำแหน่งอยู่กึ่งกลางพอดีเมื่อเรียงข้อมูลจากน้อยไปมาก',
  uses: [1]
});
Shell.on(s2, p_med);
Shell.tag(s2, p_med, '$Q_2 = 70$', {role:'work', until:'step'});

Shell.group('หาควอร์ไทล์ที่หนึ่งและควอร์ไทล์ที่สาม');
var p_q1 = b.create('point', [61, 1], {
  strokeColor: C.work,
  fillColor: C.work,
  size: 6,
  name: '',
  withLabel: false
});
var p_q3 = b.create('point', [79, 1], {
  strokeColor: C.work,
  fillColor: C.work,
  size: 6,
  name: '',
  withLabel: false
});

var s3 = Shell.step('หาควอร์ไทล์ที่หนึ่ง ($Q_1$) และควอร์ไทล์ที่สาม ($Q_3$):<br>• ตำแหน่งของ $Q_1 = \\frac{1(11+1)}{4} = 3$ ตรงกับข้อมูลตัวที่ 3 คือ <b>$61$</b><br>• ตำแหน่งของ $Q_3 = \\frac{3(11+1)}{4} = 9$ ตรงกับข้อมูลตัวที่ 9 คือ <b>$79$</b>', {
  why: 'ควอร์ไทล์แบ่งข้อมูลที่เรียงแล้วออกเป็น 4 ส่วนเท่า ๆ กัน',
  uses: [1]
});
Shell.on(s3, p_q1, p_q3);
Shell.tag(s3, p_q1, '$Q_1 = 61$', {role:'work', until:'step'});
Shell.tag(s3, p_q3, '$Q_3 = 79$', {role:'work', until:'step'});

Shell.group('หาพิสัยระหว่างควอร์ไทล์และการตรวจสอบค่านอกเกณฑ์');
var s4 = Shell.step('คำนวณพิสัยระหว่างควอร์ไทล์ ($IQR$):<br>$IQR = Q_3 - Q_1 = 79 - 61 = 18$<br>ตรวจสอบค่านอกเกณฑ์ (Outliers):<br>• ขอบล่าง: $Q_1 - 1.5(IQR) = 61 - 1.5(18) = 34$<br>• ขอบบน: $Q_3 + 1.5(IQR) = 79 + 1.5(18) = 106$<br>เนื่องจากข้อมูลทั้งหมด ($42$ ถึง $95$) อยู่ในช่วง $[34, 106]$ จึง <b>ไม่มีค่านอกเกณฑ์</b>', {
  why: 'พิสัยระหว่างควอร์ไทล์วัดการกระจายของข้อมูล $50\\%$ ตรงกลาง และใช้กำหนดเกณฑ์ค่านอกเกณฑ์',
  uses: [3]
});

Shell.group('วาดแผนภาพกล่อง (Box Plot)');
var box1 = b.create('point', [61, 2.7], {visible:false});
var box2 = b.create('point', [79, 2.7], {visible:false});
var box3 = b.create('point', [79, 4.3], {visible:false});
var box4 = b.create('point', [61, 4.3], {visible:false});

var boxPoly = b.create('polygon', [box1, box2, box3, box4], {
  fillColor: C.work,
  fillOpacity: 0.2,
  strokeColor: C.answer,
  strokeWidth: 2,
  withLines: true
});

var m1 = b.create('point', [70, 2.7], {visible:false});
var m2 = b.create('point', [70, 4.3], {visible:false});
var medSeg = b.create('segment', [m1, m2], {
  strokeColor: C.answer,
  strokeWidth: 3
});

var wLeftStart = b.create('point', [61, 3.5], {visible:false});
var wLeftEnd = b.create('point', [42, 3.5], {visible:false});
var whiskerLeft = b.create('segment', [wLeftStart, wLeftEnd], {
  strokeColor: C.answer,
  strokeWidth: 2,
  dash: 2
});

var wRightStart = b.create('point', [79, 3.5], {visible:false});
var wRightEnd = b.create('point', [95, 3.5], {visible:false});
var whiskerRight = b.create('segment', [wRightStart, wRightEnd], {
  strokeColor: C.answer,
  strokeWidth: 2,
  dash: 2
});

var tL1 = b.create('point', [42, 3.0], {visible:false});
var tL2 = b.create('point', [42, 4.0], {visible:false});
var tickLeft = b.create('segment', [tL1, tL2], {
  strokeColor: C.answer,
  strokeWidth: 2
});

var tR1 = b.create('point', [95, 3.0], {visible:false});
var tR2 = b.create('point', [95, 4.0], {visible:false});
var tickRight = b.create('segment', [tR1, tR2], {
  strokeColor: C.answer,
  strokeWidth: 2
});

var ptMin = b.create('point', [42, 3.5], {strokeColor:C.answer, fillColor:C.answer, size:4, name:'', withLabel:false});
var ptQ1 = b.create('point', [61, 3.5], {strokeColor:C.answer, fillColor:C.answer, size:4, name:'', withLabel:false});
var ptQ2 = b.create('point', [70, 3.5], {strokeColor:C.answer, fillColor:C.answer, size:4, name:'', withLabel:false});
var ptQ3 = b.create('point', [79, 3.5], {strokeColor:C.answer, fillColor:C.answer, size:4, name:'', withLabel:false});
var ptMax = b.create('point', [95, 3.5], {strokeColor:C.answer, fillColor:C.answer, size:4, name:'', withLabel:false});

var s5 = Shell.step('วาดแผนภาพกล่องจากค่าสถิติทั้ง 5 ค่า:<br>• กล่องเริ่มต้นที่ $Q_1 = 61$ และสิ้นสุดที่ $Q_3 = 79$<br>• เส้นแบ่งภายในกล่องคือมัธยฐาน ($Q_2 = 70$)<br>• หนวดแมว (Whiskers) ลากไปยังค่าต่ำสุด ($42$) และค่าสูงสุด ($95$)', {
  why: 'แผนภาพกล่องสรุปการกระจายตัวของข้อมูลและแสดงตำแหน่งควอร์ไทล์ทั้ง 3 ชัดเจน',
  uses: [2, 3, 4]
});

Shell.on(s5, boxPoly, medSeg, whiskerLeft, whiskerRight, tickLeft, tickRight, ptMin, ptQ1, ptQ2, ptQ3, ptMax);
Shell.tag(s5, ptMin, 'Min = 42', {role:'answer', until:'end'});
Shell.tag(s5, ptQ1, '$Q_1 = 61$', {role:'answer', until:'end'});
Shell.tag(s5, ptQ2, '$Q_2 = 70$', {role:'answer', until:'end'});
Shell.tag(s5, ptQ3, '$Q_3 = 79$', {role:'answer', until:'end'});
Shell.tag(s5, ptMax, 'Max = 95', {role:'answer', until:'end'});

Shell.answer('สรุปผลการวิเคราะห์ข้อมูล', 'มัธยฐาน ($Q_2$) = $70$, ควอร์ไทล์ที่หนึ่ง ($Q_1$) = $61$, ควอร์ไทล์ที่สาม ($Q_3$) = $79$, พิสัยระหว่างควอร์ไทล์ ($IQR$) = $18$', {
  sanity: 'ค่า $Q_1 < Q_2 < Q_3$ และ $IQR = 18$ สอดคล้องกับช่วงความกว้างของคะแนน $50\\%$ ตรงกลางของข้อมูล'
});

Shell.done();
</script>
</body></html>
