<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>การเคลื่อนที่ของวัตถุบนพื้นเอียงลื่น</title>
<link rel="stylesheet" href="./lib/katex.min.css">
<link rel="stylesheet" href="./lib/shell.css">
</head><body>
<script src="./lib/katex.min.js"></script>
<script src="./lib/auto-render.min.js"></script>
<script src="./lib/shell.js"></script>
<script>
var SVGNS = 'http://www.w3.org/2000/svg';

Shell.page({
  title: 'การเคลื่อนที่ของวัตถุบนพื้นเอียงลื่น',
  problem: 'วัตถุมวล 4 กก. วางบนพื้นเอียงลื่น (ไม่มีแรงเสียดทาน) ที่ทำมุม $30^\\circ$ กับแนวราบ จงหาความเร่งของวัตถุขณะไถลลงตามพื้นเอียง โดยวาดแผนภาพวัตถุอิสระ (free-body diagram) ประกอบ'
});

var g = Shell.canvas(), C = Shell.C;
var PX_PER_N = 3.2;

Shell.setup('เลือกแกนอ้างอิงให้แกนหนึ่งขนานกับพื้นเอียง และอีกแกนตั้งฉากกับพื้นเอียง เนื่องจากวัตถุถูกบังคับให้ไถลไปตามแนวพื้นเอียงเท่านั้น การเลือกแกนเช่นนี้ทำให้ความเร่งเกิดขึ้นในแนวแกนเดียว ช่วยให้คำนวณได้ง่ายโดยไม่ต้องแยกองค์ประกอบของความเร่ง');

// พื้นระดับและพื้นดินด้านล่าง
var ground = document.createElementNS(SVGNS, 'line');
ground.setAttribute('x1', 100); ground.setAttribute('y1', 450);
ground.setAttribute('x2', 860); ground.setAttribute('y2', 450);
ground.setAttribute('stroke', C.note);
ground.setAttribute('stroke-width', '2');
g.appendChild(ground);

for (var hx = 110; hx <= 850; hx += 25) {
  var hatch = document.createElementNS(SVGNS, 'line');
  hatch.setAttribute('x1', hx); hatch.setAttribute('y1', 450);
  hatch.setAttribute('x2', hx - 12); hatch.setAttribute('y2', 462);
  hatch.setAttribute('stroke', C.note);
  hatch.setAttribute('stroke-width', '1.2');
  g.appendChild(hatch);
}

// พื้นเอียงสามเหลี่ยมมุมฉาก (มุม 30 องศาที่จุด 180, 450)
var wedge = document.createElementNS(SVGNS, 'polygon');
wedge.setAttribute('points', '180,450 780,450 780,103.6');
wedge.setAttribute('fill', 'none');
wedge.setAttribute('stroke', C.given);
wedge.setAttribute('stroke-width', '2.5');
g.appendChild(wedge);

// สัญลักษณ์มุมฉาก
var rightAngle = document.createElementNS(SVGNS, 'polyline');
rightAngle.setAttribute('points', '760,450 760,430 780,430');
rightAngle.setAttribute('fill', 'none');
rightAngle.setAttribute('stroke', C.note);
rightAngle.setAttribute('stroke-width', '1.5');
g.appendChild(rightAngle);

// ส่วนโค้งแสดงมุมเอียง 30 องศา
var angleArc = document.createElementNS(SVGNS, 'path');
angleArc.setAttribute('d', 'M 240 450 A 60 60 0 0 0 231.96 420');
angleArc.setAttribute('fill', 'none');
angleArc.setAttribute('stroke', C.given);
angleArc.setAttribute('stroke-width', '2');
g.appendChild(angleArc);

Shell.label(g, 262, 436, '$30^\\circ$', {role: 'given', anchor: [236, 436], until: 'end'});

// กล่องมวล m วางแนบสนิทบนพื้นเอียง
var blockGroup = document.createElementNS(SVGNS, 'g');
blockGroup.setAttribute('transform', 'translate(476.8, 244.0) rotate(-30)');
var blockRect = document.createElementNS(SVGNS, 'rect');
blockRect.setAttribute('x', -40);
blockRect.setAttribute('y', -30);
blockRect.setAttribute('width', 80);
blockRect.setAttribute('height', 60);
blockRect.setAttribute('rx', 3);
blockRect.setAttribute('ry', 3);
blockRect.setAttribute('fill', 'none');
blockRect.setAttribute('stroke', C.given);
blockRect.setAttribute('stroke-width', '2.5');
blockGroup.appendChild(blockRect);
g.appendChild(blockGroup);

Shell.label(g, 477, 244, '$m = 4$ kg', {role: 'given', anchor: [477, 244], until: 'end'});

// กลุ่มที่ 1: แผนภาพวัตถุอิสระ
Shell.group('สร้างแผนภาพวัตถุอิสระ (Free-Body Diagram)');

var s1 = Shell.step('หาน้ำหนักของวัตถุ $W = mg = (4)(9.8) = 39.2$ N มีทิศพุ่งลงในแนวดิ่งสู่ศูนย์กลางโลกเสมอ', {
  why: 'แรงโน้มถ่วงกระทำต่อวัตถุในแนวดิ่งเสมอ ไม่ขึ้นกับความเอียงของพื้นผิว'
});
Shell.arrow(s1, 477, 244, 477, 369.44, {
  role: 'given',
  label: '$W = 39.2$ N',
  value: 39.2,
  unit: 'N',
  until: 'end'
});

var s2 = Shell.step('เขียนแรงปฏิกิริยาตั้งฉาก $N$ ที่พื้นเอียงดันวัตถุในทิศตั้งฉากกับผิวสัมผัสและพุ่งออกจากพื้นเอียง (ไม่มีแรงเสียดทานเพราะพื้นลื่น)', {
  why: 'แรงปฏิกิริยาจากพื้นรองรับมีทิศตั้งฉากกับผิวสัมผัสเสมอ และโจทย์ระบุว่าพื้นลื่นจึงไม่มีแรงเสียดทานในแนวระนาบ'
});
Shell.arrow(s2, 477, 244, 422.68, 149.91, {
  role: 'work',
  label: '$N = 33.95$ N',
  value: 33.95,
  unit: 'N',
  until: 'end'
});

// กลุ่มที่ 2: แตกแรงเข้าสู่แนวแกน
Shell.group('แตกแรงเข้าสู่แนวแกนอ้างอิง');

var s3 = Shell.step('แตกน้ำหนัก $W$ เข้าสู่แนวแกนขนานและแนวแกนตั้งฉากกับพื้นเอียง โดยมุมระหว่างแนวดิ่งกับแนวตั้งฉากคือ $30^\\circ$<br>• แนวตั้งฉาก: $W_\\perp = W\\cos 30^\\circ = (39.2)(0.866) = 33.95$ N<br>• แนวขนาน: $W_\\parallel = W\\sin 30^\\circ = (39.2)(0.5) = 19.6$ N', {
  why: 'ต้องแตกแรงที่ไม่อยู่ในแนวแกนอ้างอิง เพื่อให้สามารถวิเคราะห์สมดุลและการเคลื่อนที่ในแต่ละแกนแยกจากกันได้',
  uses: [1]
});

Shell.arrow(s3, 477, 244, 531.32, 338.09, {
  role: 'work',
  label: '$W_\\perp = 33.95$ N',
  value: 33.95,
  unit: 'N',
  until: 'step',
  dash: true
});

Shell.arrow(s3, 477, 244, 422.68, 275.36, {
  role: 'work',
  label: '$W_\\parallel = 19.6$ N',
  value: 19.6,
  unit: 'N',
  until: 'end'
});

// เส้นประแสดงการประกอบเวกเตอร์สี่เหลี่ยมผืนผ้า
var proj1 = document.createElementNS(SVGNS, 'line');
proj1.setAttribute('x1', 422.68); proj1.setAttribute('y1', 275.36);
proj1.setAttribute('x2', 477); proj1.setAttribute('y2', 369.44);
proj1.setAttribute('stroke', C.note);
proj1.setAttribute('stroke-dasharray', '4 4');
s3.appendChild(proj1);

var proj2 = document.createElementNS(SVGNS, 'line');
proj2.setAttribute('x1', 531.32); proj2.setAttribute('y1', 338.09);
proj2.setAttribute('x2', 477); proj2.setAttribute('y2', 369.44);
proj2.setAttribute('stroke', C.note);
proj2.setAttribute('stroke-dasharray', '4 4');
s3.appendChild(proj2);

// ส่วนโค้งแสดงมุม 30 องศาระหว่างแนวดิ่งกับแนวตั้งฉากพื้นเอียง
var arc30 = document.createElementNS(SVGNS, 'path');
arc30.setAttribute('d', 'M 499.5 282.97 A 45 45 0 0 1 477 289');
arc30.setAttribute('fill', 'none');
arc30.setAttribute('stroke', C.note);
arc30.setAttribute('stroke-width', '1.5');
s3.appendChild(arc30);

Shell.label(s3, 497, 305, '$30^\\circ$', {
  role: 'note',
  anchor: [490, 288],
  until: 'step'
});

// กลุ่มที่ 3: คำนวณความเร่งตามกฎนิวตัน
Shell.group('คำนวณความเร่งตามกฎการเคลื่อนที่ของนิวตัน');

var s4 = Shell.step('พิจารณาแนวตั้งฉากพื้นเอียง: วัตถุไม่ลอยขึ้นและไม่จมลงในพื้นเอียง ($a_\\perp = 0$)<br>จาก $\\sum F_\\perp = 0$ จะได้ $N - W_\\perp = 0 \\implies N = W_\\perp = 33.95$ N', {
  why: 'แรงในแนวตั้งฉากพื้นเอียงต้องอยู่ในภาวะสมดุลเพราะไม่มีการเคลื่อนที่ในแนวนี้',
  uses: [2, 3]
});

var s5 = Shell.step('พิจารณาแนวขนานพื้นเอียง: มีแรง $W_\\parallel$ ดึงวัตถุลงตามพื้นเอียงเพียงแรงเดียว<br>ใช้กฎข้อที่สองของนิวตัน $\\sum F_\\parallel = ma$ จะได้ $W_\\parallel = ma$', {
  why: 'มีแรงลัพธ์ในแนวขนานพื้นเอียงกระทำต่อมวล วัตถุจึงเคลื่อนที่ด้วยความเร่งตามแนวพื้นเอียง',
  uses: [3]
});

var s6 = Shell.step('แทนค่าหาความเร่ง $a = \\frac{W_\\parallel}{m} = \\frac{19.6}{4} = 4.9$ m/s²<br>(หรือคิดลัดจาก $a = g\\sin 30^\\circ = (9.8)(0.5) = 4.9$ m/s² ทิศทางไถลลงตามแนวพื้นเอียง)', {
  uses: [5]
});

Shell.answer(
  'ความเร่งของวัตถุขณะไถลลงตามพื้นเอียง',
  '$a = 4.9$ m/s²',
  {
    sanity: 'ความเร่ง $a = 4.9$ m/s² น้อยกว่าความเร่งโน้มถ่วง $g = 9.8$ m/s² และเท่ากับ $g\\sin 30^\\circ$ พอดี ซึ่งไม่ขึ้นกับมวลของวัตถุ โดยที่ขอบเขต $\\theta = 0^\\circ \\implies a = 0$ (พื้นราบ) และ $\\theta = 90^\\circ \\implies a = g$ (ตกอิสระ)'
  }
);

Shell.done();
</script>
</body></html>
