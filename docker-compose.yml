# Four services and a database. `pages` is deliberately its own service on its
# own port: generated pages contain model-written scripts, so they are served
# from a different origin than the app and embedded in a sandboxed iframe.
#
# Stage 1 needs only `pages` + `web` (a fixed set of fixture pages, no API, no
# DB, no model calls). `db`/`api`/`worker` are stage 3+ and don't even have
# Dockerfiles yet, so they're behind the "backend" profile below — a plain
# `docker compose up --build` (no flags, matching the README) brings up just
# the default-profile services, i.e. stage 1. Run
# `docker compose --profile backend up --build` once stage 3 exists.
services:
  db:
    image: postgres:16-alpine
    profiles: ["backend"]
    environment:
      POSTGRES_USER: jumpais
      POSTGRES_PASSWORD: jumpais
      POSTGRES_DB: jumpais
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumpais"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ["backend"]
    environment:
      DATABASE_URL: postgresql+psycopg://jumpais:jumpais@db:5432/jumpais
      PAGES_ORIGIN: http://localhost:8080
      WEB_ORIGIN: http://localhost:5173
      STORAGE_DIR: /storage
      PUBLISHED_DIR: /published
    ports: ["8000:8000"]
    # the source is mounted so an edit reloads instead of needing a rebuild;
    # the image still COPYs it, so a built image runs standalone
    volumes:
      # `storage` is where the worker drops a generated page — a draft, not
      # servable by anyone (see the `pages` service below). `published` is
      # what the pages origin actually serves; the API is the only thing that
      # writes into it, and only from review_page() on approval. That asymmetry
      # — one writer with no HTTP surface of its own, one reader with no write
      # access — is what makes an unapproved page unreachable rather than
      # merely unlinked.
      - "storage:/storage"
      - "published:/published"
      - "./packages/kit:/kit:ro"
      - "./apps/api/app:/app/app"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    profiles: ["backend"]
    environment:
      DATABASE_URL: postgresql+psycopg://jumpais:jumpais@db:5432/jumpais
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEN_MODEL: ${GEN_MODEL:-gemini-3.8-flash}
      GEN_EFFORT: ${GEN_EFFORT:-high}
    volumes: ["storage:/storage", "./packages/kit:/kit:ro"]
    depends_on: { db: { condition: service_healthy } }

  # separate origin, static only, no API surface at all
  pages:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      # Two sources, served as siblings.
      #
      # /pages/    the fixtures that ship in this repo — they back the demo when
      #            nothing has been generated yet.
      # /generated/ APPROVED worker output — the `published` volume, not the
      #            `storage` one the worker actually writes to. The worker
      #            drops a freshly generated page in `storage`, which nothing
      #            here mounts; the API copies a page into `published` only
      #            from review_page() when a teacher approves it (see
      #            apps/api/app/main.py). A page this container has never been
      #            given a copy of is not "hidden", it does not exist on this
      #            filesystem at all, so there is no path — guessed, logged, or
      #            bookmarked — that serves a draft. This container has no
      #            write access to either volume.
      #
      # They cannot be nested — a mount cannot be created inside a read-only
      # bind — so they sit side by side, and published/lib -> ../lib (created
      # by the API on startup) lands directly on the lib mount below.
      - "./apps/pages/static/pages:/usr/share/nginx/html/pages:ro"
      - "published:/usr/share/nginx/html/generated:ro"
      - "./packages/kit/lib:/usr/share/nginx/html/lib:ro"
      - "./apps/pages/nginx.conf:/etc/nginx/conf.d/default.conf:ro"

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_PAGES_URL: http://localhost:8080
    ports: ["5173:5173"]
    volumes:
      # live-reload against the host source; the anonymous volume keeps the
      # image's own node_modules instead of an (absent) host one shadowing it.
      - "./apps/web:/app"
      - "/app/node_modules"

volumes:
  pgdata:
  storage:
  published:
